/* ===========================================================
   화면별 규칙
   선택자는 그 화면에만 있는 이름이라 다른 화면에서는 걸리지 않는다.
   =========================================================== */

/* ---- 시작 화면 ---- */
.lead{ font-size:var(--t-lead); }
.c{ padding:var(--card-pad); }
.c .d{ font-size:var(--t-small); line-height:var(--lh-small); }
.c .go{ color:var(--ui-fg-lower); font-weight:400; font-size:var(--t-caption); }
/* 이 페이지의 유일한 유채색. 글자가 앉는 아래쪽만 눌러 대비를 만든다. */
.c.main{
  background:linear-gradient(180deg,rgba(0,0,0,0) 22%,rgba(0,0,0,.88)),var(--iridescent);
  border-color:transparent;
  padding:var(--sp-152) var(--card-pad) var(--sp-40);
  justify-content:flex-end;
}
.c.main .n{ color:var(--paper); font-size:var(--t-sub); font-weight:300; }
.c.main .d,.c.main .go{ color:rgba(255,255,255,.9); max-width:62ch; }
.c.main .d b{ font-weight:400; color:var(--paper); }
.c.main:hover{ border-color:transparent; }
.st{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.st .n{
  border-radius:var(--r-pill);
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
}
.st .d{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 사용설명서 ---- */
.file,.qa,.case{ padding:var(--card-pad); }
.fd,.q,.a{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 조립기 ---- */
.swatchpick,.ramp,.rl{ border-radius:var(--r-flat); }
.seg{
  border-radius:var(--r-pill);
  padding:3px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);
}
.hint,.psub{ font-size:var(--t-caption); color:var(--ui-fg-lower); }

/* ---- 생성기 ---- */
.lbl{
  font-size:var(--t-caption);
  color:var(--ui-fg-lower);
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* ---- 모음집 ---- */
.composer{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.dscard .body{ padding:var(--card-pad); }
.dscard .desc{ font-size:var(--t-small); line-height:var(--lh-small); }
.dscard .cover{ border-bottom:var(--hair) solid var(--ui-border); }
.backbar{ border-bottom:var(--hair) solid var(--ui-border); }
/* 구분은 헤어라인만 쓴다. 굵은 줄을 두지 않는다. */
.dhead,.crumbs,.refbar,.dnav{
  border-bottom-width:var(--hair);
  border-bottom-color:var(--ui-border);
}
.dsec{
  border-top:var(--hair) solid var(--ui-border);
  padding-top:var(--section-gap);
  margin-top:var(--section-gap);
}
.dtabs{ gap:var(--sp-8); }
.grouphint{ font-size:var(--t-caption); color:var(--ui-fg-lower); }
.specbar .filterchip{ padding:8px 18px; }
.specview{
  background:var(--ui-panel-2);
  color:var(--ui-fg-lower);
  border:var(--hair) solid var(--ui-border);
  font-size:var(--t-caption);
}

/* ---- 화면 자체 CSS 가 더 깊은 선택자로 잡아 둔 자리 ----
   같은 깊이로 다시 적어 킷 값이 적용되게 한다. */
.composer h3,.panel h2,.sec h2{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
  color:var(--ui-fg-strong);
}
.composer .csub{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 복사한 다음 할 일 ---- */
.cnext{
  margin-top:var(--el-gap);
  padding:12px 16px;
  border:var(--hair) solid var(--ui-line);
  border-radius:var(--r-flat);
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-strong);
  background:var(--ui-panel-2);
}
.scount{ font-size:var(--t-caption); color:var(--ui-fg-dim); white-space:nowrap; }
.noresult{
  grid-column:1/-1;
  padding:var(--sp-64) var(--card-pad);
  border:var(--hair) dashed var(--ui-border);
  text-align:center;
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-lower);
}
.noresult .filterchip{ margin-top:var(--el-gap); }

/* ---- 키보드로 닿는 자리를 보이게 ----
   킷이 접근성을 가르치면서 정작 자기 화면에는 초점 표시가 없었다.
   카드는 button 이 아니라 div 라 role 과 tabindex 로 닿게 해 뒀다. */
:focus-visible{
  outline:2px solid var(--ui-line);
  outline-offset:2px;
}
.dscard[role="button"],.lcard[role="button"],.rec[role="button"],.logo[role="button"]{
  cursor:pointer;
}
.dscard:focus-visible,.lcard:focus-visible,.rec:focus-visible{
  outline:2px solid var(--ui-line);
  outline-offset:-2px;
  border-color:var(--ui-line);
}
/* 마우스로 누를 때는 테두리를 그리지 않는다 */
.dscard:focus:not(:focus-visible),.lcard:focus:not(:focus-visible),
.rec:focus:not(:focus-visible),.logo:focus:not(:focus-visible){ outline:none; }

/* 터치로 누르는 자리는 44px 이상 */
@media(pointer:coarse){
  .tbtn,.filterchip,.backbtn,.tabs button,.dtabs button,.appnav a,.iconbtn,.seg button{
    min-height:44px;
  }
}

/* ---- 강조 버튼. 바탕과 글자가 같은 색이 되지 않게 짝으로 둔다 ----
   화면 CSS 는 color:#fff 로 박아 둬서 다크 모드에서 흰 바탕에 흰 글씨가 됐다. */
.tbtn.pri,.gbtn.pri,.fstep .n,.st .n{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
  font-weight:400;
}
.tbtn.pri{ border-radius:var(--r-pill); }

/* ---- 좁은 화면에서 상단 바가 가로로 넘치지 않게 ---- */
@media(max-width:768px){
  .top,.topbar{ flex-wrap:wrap; row-gap:8px; }
  .appnav{ order:10; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .appnav::-webkit-scrollbar{ height:0; }
  .top .sp,.topbar .spacer{ flex:1 1 auto; }
}

/* ---- 대비를 보장하는 자리 ---- */

/* 카드 표지의 글꼴 미리보기는 시스템 색 띠 위에 올라간다.
   띠 색이 밝으면 흰 글씨가 묻히므로 아래쪽에 어두운 막을 깐다. */
.dscard .cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.66));
  pointer-events:none;
}
.dscard .cover .fontpreview{
  position:relative;
  z-index:1;
  color:#fff;
  font-weight:400;
  text-shadow:none;
}

/* 흐린 글자가 회색 면 위에 앉으면 4.5 를 못 넘는다. 한 단 진하게 쓴다. */
.autoinfo,.hint,.psub,.grouphint,.note,.foldbody .hint{ color:var(--ui-fg-lower); }

/* 규칙 추가 버튼과 주의 상자 제목 */
.ruleadd button{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border:var(--hair) solid var(--ui-fg-strong);
  border-radius:var(--r-pill);
  font-weight:400;
}
.warn .th,.tip .th{ color:var(--ui-fg-strong); font-weight:400; }

(function(){
  var r=document.documentElement;
  window.dskQuery=function(){ try{ return '?'+parent.dsk.q(); }catch(e){ return ''; } };
  // 모음집은 data-theme 으로, 나머지 화면은 data-ui 로 테마를 잡는다.
  // 화면마다 이름이 달라 그대로 두면 모음집만 따로 논다. 쓰는 이름에 맞춰 옮긴다.
  var ATTR = r.hasAttribute('data-theme') ? 'data-theme' : 'data-ui';
  try{ var t=localStorage.getItem('dsk_ui'); if(t) r.setAttribute(ATTR,t); }catch(e){}
  try{
    new MutationObserver(function(){
      try{ localStorage.setItem('dsk_ui', r.getAttribute(ATTR)||'light'); }catch(e){}
    }).observe(r,{attributes:true,attributeFilter:['data-ui','data-theme']});
  }catch(e){}
  var MAP={'index.html':'index','library.html':'library','builder.html':'builder',
           'generator.html':'generator','guide.html':'guide'};
  document.addEventListener('click',function(e){

}
function radii(){

:root,:root[data-ui="light"]{
  --ui-canvas:#F6F5F2;--ui-panel:#FFFFFF;--ui-panel-2:#F2F0EB;
  --ui-fg:#17161B;--ui-fg-strong:#2A2830;--ui-fg-lower:#5E5A63;--ui-fg-dim:#A9A6AE;
  --ui-border:#E7E4DD;--ui-border-low:#F0EDE6;--ui-accent:#A24E38;
  --ui-sh:0 1px 3px rgba(30,24,50,.06);--ui-sh-md:0 6px 20px rgba(30,24,50,.09);
}
*{box-sizing:border-box;}
body{margin:0;-webkit-font-smoothing:antialiased;}
button{font:inherit;}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;}
.top .logo{display:flex;align-items:center;gap:8px;}
.top .mk{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 140deg,#A24E38,#C98A5B,#3F5E56,#A24E38);}
.top .sp{flex:1;}
.appnav{display:flex;}
.appnav a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;}
@media(max-width:640px){.appnav a span{display:none;}}

.tbtn{cursor:pointer;}
.tbtn.pri{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700;}

.wrap{display:grid;grid-template-columns:360px 1fr;gap:22px;margin:0 auto;padding:22px 24px 60px;}
@media(max-width:980px){.wrap{grid-template-columns:1fr;}}
.panel{background:var(--ui-panel);border:1px solid var(--ui-border);padding:18px;position:sticky;top:70px;max-height:calc(100vh - 92px);overflow-y:auto;}
@media(max-width:980px){.panel{position:static;max-height:none;}}
.step{margin-bottom:20px;}
.step>label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ui-fg-lower);margin-bottom:8px;}
.step>label i{width:18px;height:18px;border-radius:6px;background:var(--ui-accent);color:#fff;display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:800;flex:none;}
select.sel{width:100%;font:inherit;font-size:13px;padding:10px 11px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);cursor:pointer;}
select.sel:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ui-fg-strong);padding:5px 0;cursor:pointer;line-height:1.55;}
.chk input{margin:2px 0 0;accent-color:var(--ui-accent);flex:none;width:15px;height:15px;}
.chk small{display:block;color:var(--ui-fg-dim);font-size:11px;}
.brief input,.brief textarea{width:100%;font:inherit;font-size:12.5px;padding:9px 11px;border:1px solid var(--ui-border);
  border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);margin-bottom:7px;font-family:inherit;}
.brief textarea{min-height:110px;resize:vertical;line-height:1.65;}
.brief input:focus,.brief textarea:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.brief .lbl{font-size:11px;color:var(--ui-fg-dim);margin:-3px 0 4px 2px;}
.exbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.exbtns button{cursor:pointer;}
.exbtns button:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
.ruleadd{display:flex;gap:6px;margin-top:8px;}
.ruleadd input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel-2);color:var(--ui-fg);}
.ruleadd button{border:0;background:var(--ui-accent);color:#fff;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;}
.mylist{list-style:none;margin:8px 0 0;padding:0;}
.mylist li{display:flex;gap:6px;font-size:12px;color:var(--ui-fg-strong);padding:4px 0;border-bottom:1px solid var(--ui-border-low);}
.mylist .x{margin-left:auto;border:0;background:none;color:var(--ui-fg-dim);cursor:pointer;font-size:14px;}
.infobox{margin-top:9px;background:var(--ui-panel-2);border:1px solid var(--ui-border);padding:11px 13px;}
.infobox .ir{display:flex;gap:8px;font-size:11.5px;line-height:1.7;padding:3px 0;}
.infobox .ik{flex:none;width:52px;font-weight:800;color:var(--ui-accent);}
.infobox .iv{color:var(--ui-fg-lower);}
.infobox .iv b{color:var(--ui-fg-strong);}
.metarow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.metarow span{font-size:11px;font-weight:700;background:var(--ui-panel);border:1px solid var(--ui-border);
  color:var(--ui-fg-lower);padding:3px 9px;border-radius:999px;}
.layprev{margin-top:9px;background:var(--ui-panel-2);border:1px solid var(--ui-border);padding:10px;display:flex;flex-direction:column;gap:6px;height:132px;}
.layprev .b{background:var(--ui-border);border-radius:4px;}
.layprev .a{background:color-mix(in srgb,var(--ui-accent) 42%,var(--ui-border));border-radius:4px;}
.layprev .r{display:flex;gap:6px;flex:1;}
.laycap{font-size:11px;color:var(--ui-fg-dim);margin-top:6px;line-height:1.6;}
.laycap b{color:var(--ui-fg-strong);}
.hint{margin-top:6px;line-height:1.6;}
.autoinfo{font-size:11.5px;color:var(--ui-fg-dim);text-align:center;padding:10px;background:var(--ui-panel-2);}
.gobtn{width:100%;cursor:pointer;margin-top:4px;}
.gobtn:hover{filter:brightness(1.15);}

.stage{display:flex;flex-direction:column;gap:16px;min-width:0;}
.card{background:var(--ui-panel);border:1px solid var(--ui-border);padding:18px;}
.card h3{margin:0 0 2px;font-size:14px;font-weight:800;}
.card .csub{font-size:11.5px;color:var(--ui-fg-dim);margin-bottom:12px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
.tabs button{cursor:pointer;}
.frame{width:100%;height:min(78vh,900px);border:1px solid var(--ui-border);background:#fff;}
.dev{display:flex;gap:6px;margin-bottom:10px;}
.dev button{border:1px solid var(--ui-border);background:var(--ui-panel-2);color:var(--ui-fg-lower);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;}
.dev button.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700;}
.out{position:relative;background:#0d1117;color:#c9d1d9;padding:15px;font-family:"Roboto Mono",monospace;font-size:11.5px;line-height:1.65;max-height:520px;overflow:auto;white-space:pre;}
.out .cp{position:absolute;top:10px;right:10px;background:#238636;color:#fff;border:0;border-radius:7px;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;}
.secpick{max-height:230px;overflow:auto;border:1px solid var(--ui-border);border-radius:10px;padding:8px 10px;background:var(--ui-panel-2);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ui-fg-strong);color:var(--ui-canvas);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</style>
<style>
/* src/kit.css */
/* ===========================================================
   Design System Kit 셸 스타일시트

   화면 다섯 개가 함께 쓰는 한 벌이다. 화면마다 따로 정의하지 않는다.
   값은 monopo saigon 토큰 원본(refero 추출본)을 그대로 쓴다.

   각 화면의 <style> 뒤에 실려서 같은 선택자면 이 파일이 이긴다.
   !important 는 쓰지 않는다. 깊은 선택자를 덮어야 할 때는
   클래스를 두 번 적어(.chip.chip) 우선순위만 올린다.

   미리보기 영역(.demo 안쪽)은 각 시스템 고유 토큰이 지배한다.
   이 파일은 그 안쪽을 건드리지 않는다.
   =========================================================== */

/* ---------- 토큰 ---------- */
:root{
  --obsidian:#000000;
  --paper:#ffffff;
  --inkstone:#181818;
  --felt-gray:#6d6d6d;
  --slate-pill:#636363;
  --ash-mist:#9a9a9a;
  --pewter:#808080;
  --iridescent:linear-gradient(90deg,rgb(160,224,171),rgb(255,172,46) 50%,rgb(165,45,37));

  --sp-8:8px; --sp-12:12px; --sp-28:28px; --sp-40:40px;
  --sp-48:48px; --sp-64:64px; --sp-68:68px; --sp-152:152px;

  --page-max:1078px;
  --section-gap:46px;
  --card-pad:34px;
  --el-gap:14px;

  --r-pill:75px;
  --r-flat:0px;
  --hair:1px;
  --ease:cubic-bezier(.19,1,.22,1);

  /* 글자 단. 제목 행간은 스펙 값, 본문 행간은 한글에 맞춰 연다.
     스펙의 본문 1.15~1.21 은 라틴 기준이라 한글에서 줄이 붙는다. */
  --t-eyebrow:11px;  --lh-eyebrow:1.36;
  --t-caption:12px;  --lh-caption:1.5;
  --t-small:14px;    --lh-small:1.6;
  --t-body:16px;     --lh-body:1.6;
  --t-lead:18px;     --lh-lead:1.6;
  --t-card:20px;     --lh-card:1.35;
  --t-sub:29px;      --lh-sub:1.3;
  --t-sec:39px;      --lh-sec:1.19;
  --t-head:78px;     --lh-head:1.1;

  --font-sans:"Inter","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}

:root,
:root[data-theme="light"],
:root[data-ui="light"]{
  --ui-canvas:var(--paper);
  --ui-panel:var(--paper);
  --ui-panel-2:#F4F4F4;
  --ui-fg:var(--obsidian);
  --ui-fg-strong:var(--obsidian);
  --ui-fg-lower:var(--felt-gray);
  /* Ash Mist 와 Pewter 는 스펙에서 테두리와 비활성 면에 쓰라고 한 값이다.
     흰 바탕에서 2.81 대 1 이라 글자에 쓰면 읽히지 않는다. 글자에는 4.5 를 넘는 값을 쓴다. */
  --ui-fg-dim:#767676;
  --ui-border:#E3E3E3;
  --ui-border-low:#F0F0F0;
  --ui-line:var(--obsidian);
  --ui-accent:var(--obsidian);
  --ui-shadow-sm:none; --ui-shadow-md:none; --ui-shadow-lg:none;
  --ui-sh:none; --ui-sh-md:none;
}

:root[data-theme="dark"],
:root[data-ui="dark"]{
  --ui-canvas:var(--obsidian);
  --ui-panel:var(--obsidian);
  --ui-panel-2:var(--inkstone);
  --ui-fg:var(--paper);
  --ui-fg-strong:var(--paper);
  --ui-fg-lower:var(--ash-mist);
  /* 검정 바탕에서 Felt Gray 는 4.06 대 1 이라 기준에 못 미친다 */
  --ui-fg-dim:#8a8a8a;
  --ui-border:rgba(255,255,255,.22);
  --ui-border-low:rgba(255,255,255,.12);
  --ui-line:rgba(255,255,255,.75);
  --ui-accent:var(--paper);
  --ui-shadow-sm:none; --ui-shadow-md:none; --ui-shadow-lg:none;
  --ui-sh:none; --ui-sh-md:none;
}

/* ---------- 바탕과 한글 줄바꿈 ----------
   브라우저 기본값은 한글을 글자 단위로 끊어 단어가 쪼개진다.
   단어 단위로 바뀌게 처음부터 지정한다. */
body{
  font-family:var(--font-sans);
  font-size:var(--t-body);
  line-height:var(--lh-body);
  letter-spacing:-.005em;
  word-break:keep-all;
  overflow-wrap:break-word;
  line-break:strict;
  background:var(--ui-canvas);
  color:var(--ui-fg);
}
h1,h2,h3,h4,.sectitle,.dt2,.dt3,.gtitle,.ct,.hero h1{ text-wrap:balance; }
p,.lead,.dsc,.csub,.secsub,.desc,.d{ text-wrap:pretty; }

.mono,code,pre,.specview,.specta{ font-family:var(--font-mono); }
a{ text-decoration:none; color:inherit; }

/* ---------- 글자 단 ---------- */
h1,.hero h1{
  font-family:var(--font-sans);
  font-weight:300;
  font-size:clamp(34px,5.4vw,var(--t-head));
  line-height:var(--lh-head);
  letter-spacing:-.035em;
  margin:0 0 var(--sp-28);
  color:var(--ui-fg-strong);
}
h2,.sectitle,.dt2,.gtitle{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-sub);
  line-height:var(--lh-sub);
  letter-spacing:-.025em;
}
h3,.dt3,.ct{
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
}
.dscard h3,.c .n,.st .t{
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
}
.lead,.hero p,.csub,.secsub,.dsc{
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-lower);
  max-width:74ch;
}
.en{
  font-size:var(--t-eyebrow);
  line-height:var(--lh-eyebrow);
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ui-fg-dim);
}
/* 45px 위로는 굵게 쓰지 않는다. 본문 강조는 굵기 대신 색으로 준다. */
h1 b,h1 strong,h2 b,h2 strong{ font-weight:400; }
.lead b,.lead strong,.hero p b,.csub b,.secsub b,
.dsc b,.dsc strong,.c .d b,.st .d b{
  font-weight:400;
  color:var(--ui-fg-strong);
}

/* ---------- 상단 바 ---------- */
.top,.topbar{
  border-bottom:var(--hair) solid var(--ui-border);
  background:var(--ui-canvas);
  backdrop-filter:none;
  padding:var(--sp-12) var(--sp-28);
}
.topbar .logo,.top .logo{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-body);
  letter-spacing:-.02em;
}
.topbar .logo .mk,.top .logo .mk,.mk.mk{
  border-radius:var(--r-flat);
  background:var(--ui-fg-strong);
  width:20px;
  height:20px;
}
.topbar .logo .dim,.top .logo .dim{ color:var(--ui-fg-dim); font-weight:400; }

.appnav{
  background:transparent;
  border:0;
  border-radius:var(--r-flat);
  padding:0;
  gap:var(--sp-8);
}
.appnav a{
  border:var(--hair) solid transparent;
  border-radius:var(--r-pill);
  font-weight:400;
  font-size:var(--t-small);
  padding:7px 16px;
  color:var(--ui-fg-lower);
  transition:color .4s ease,border-color .4s ease;
}
.appnav a:hover{
  background:transparent;
  border-color:var(--ui-border);
  color:var(--ui-fg-strong);
}
.appnav a.on{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
}

/* ---------- 조작부. 알약은 행동에만 쓴다 ---------- */
.tbtn,.filterchip,.backbtn,.morebtn,.cbtn,
.tabs button,.dtabs button,.seg button,.exbtns button{
  border-radius:var(--r-pill);
  box-shadow:none;
  font-weight:400;
  font-size:var(--t-small);
  padding:9px 20px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);
  color:var(--ui-fg-lower);
  transition:color .4s ease,border-color .4s ease,background .4s ease;
}
.tbtn:hover,.filterchip:hover,.backbtn:hover,
.tabs button:hover,.dtabs button:hover{
  border-color:var(--ui-line);
  color:var(--ui-fg-strong);
}
.filterchip.on,.tabs button.on,.dtabs button.on,.seg button.on{
  font-weight:400;
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
}
.cgo,.gbtn,.gobtn{
  border-radius:var(--r-pill);
  box-shadow:none;
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border:var(--hair) solid var(--ui-fg-strong);
  font-weight:400;
  font-size:var(--t-body);
  padding:11px 33px;
}
.iconbtn{
  font-family:var(--font-sans);
  font-weight:400;
  border-radius:var(--r-pill);
  box-shadow:none;
  width:auto;
  min-width:36px;
  height:36px;
  padding:0 14px;
  border:var(--hair) solid var(--ui-border);
  background:transparent;
  color:var(--ui-fg-lower);
  font-size:var(--t-caption);
}
.iconbtn:hover{ border-color:var(--ui-line); color:var(--ui-fg-strong); }
/* 어두운 코드 상자 위의 복사 버튼 */
.copy{
  border-radius:var(--r-pill);
  background:var(--paper);
  color:var(--obsidian);
  border:var(--hair) solid var(--paper);
  font-weight:400;
  font-size:var(--t-caption);
  padding:7px 16px;
  box-shadow:none;
}

/* ---------- 태그는 고스트 알약 ---------- */
.pill,.count,.stats span{
  border-radius:var(--r-pill);
  background:transparent;
  border:var(--hair) solid var(--ui-border);
  color:var(--ui-fg-lower);
  font-weight:400;
  font-size:var(--t-caption);
  padding:5px 14px;
  box-shadow:none;
}

/* ---------- 면은 직각, 그림자 없음 ---------- */
.card,.panel,.out,.stage,.frame,.search,.searchbar,.composer,.cout,.export,
.note,.infobox,.dscard,.addcard,.lcard,.rec,.foldbody,.specview,.specta,
.rulebox,.myrules,.qa,.case,.file,.c,.st,.preview,.gcard,.layprev,.brief,
.autoinfo,.cwrap,.selectbox,.sel,.step,.dsec,.warn,.tip{
  border-radius:var(--r-flat);
  box-shadow:none;
}
.search,.searchbar,.cwrap,.selectbox,.sel{
  border:var(--hair) solid var(--ui-border);
}
.dscard,.lcard,.rec,.c,.file,.qa,.case{
  border:var(--hair) solid var(--ui-border);
  transition:border-color .8s var(--ease);
}
.dscard:hover,.lcard:hover,.rec:hover,.c:hover,.file:hover{
  transform:none;
  border-color:var(--ui-line);
}
.export,.cout{ background:var(--obsidian); color:var(--paper); }

/* ---------- 간격 ---------- */
.wrap{ max-width:var(--page-max); }
.sectitle{ margin-top:var(--section-gap); }
.cards,.steps,.recs,.lwrap{ gap:var(--el-gap); }

/* ---------- 미리보기 영역은 각 시스템 토큰이 지배한다 ---------- */
#detail .demo,#detail .demo *,
#sview .demo,#sview .demo *{
  border-radius:revert;
  font-family:revert;
  font-size:revert;
  line-height:revert;
  letter-spacing:revert;
}

@media(prefers-reduced-motion:reduce){
  *{ transition-duration:.01ms; animation-duration:.01ms; }
}
@media(max-width:768px){
  :root{ --card-pad:20px; --section-gap:32px; }
  .top,.topbar{ padding:10px 16px; }
}

/* ===========================================================
   화면별 규칙
   선택자는 그 화면에만 있는 이름이라 다른 화면에서는 걸리지 않는다.
   =========================================================== */

/* ---- 시작 화면 ---- */
.lead{ font-size:var(--t-lead); }
.c{ padding:var(--card-pad); }
.c .d{ font-size:var(--t-small); line-height:var(--lh-small); }
.c .go{ color:var(--ui-fg-lower); font-weight:400; font-size:var(--t-caption); }
/* 이 페이지의 유일한 유채색. 글자가 앉는 아래쪽만 눌러 대비를 만든다. */
.c.main{
  background:linear-gradient(180deg,rgba(0,0,0,0) 22%,rgba(0,0,0,.88)),var(--iridescent);
  border-color:transparent;
  padding:var(--sp-152) var(--card-pad) var(--sp-40);
  justify-content:flex-end;
}
.c.main .n{ color:var(--paper); font-size:var(--t-sub); font-weight:300; }
.c.main .d,.c.main .go{ color:rgba(255,255,255,.9); max-width:62ch; }
.c.main .d b{ font-weight:400; color:var(--paper); }
.c.main:hover{ border-color:transparent; }
.st{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.st .n{
  border-radius:var(--r-pill);
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
}
.st .d{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 사용설명서 ---- */
.file,.qa,.case{ padding:var(--card-pad); }
.fd,.q,.a{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 조립기 ---- */

   [/성분|아이콘|연동|배지|기능 카드/,'아이콘','SVG 권장 · PNG 96×96 (@2x 192)','1/1'],
   [/의료진|팀|프로필|셰프/,'인물 사진','800×800 (1:1), 상반신','1/1'],
   [/메뉴|시그니처|코스/,'메뉴 사진','1200×900 (4:3), 45° 촬영','4/3'],
   [/텍스처|상세컷|스와치/,'세로 상세컷','가로 860~1000px 고정','3/4'],
   [/UI 데모|스크린샷|대시보드/,'제품 UI','2560×1440 실제 화면 캡처','16/9'],
   [/로고/,'로고','SVG 또는 PNG 높이 80px (@2x 160)','3/1'],
   [/리뷰|후기|포토/,'포토리뷰','600×600 (1:1)','1/1'],
   [/지도|오시는 길/,'지도','1200×675, 캡처 또는 임베드','16/9']];

}

   tip:'한 줄 <b>45~75자</b>가 가장 읽기 좋습니다. 폭을 더 넓히지 마세요',
   sec:'3~7개 섹션', mob:'여백만 줄고 구조 동일'},
 split:{w:'<div class="r"><div class="a" style="flex:1"></div><div class="b" style="flex:1"></div></div>',
   n:'반반 (스플릿)',
   c:'화면을 정확히 둘로 나눠 사진과 글이 마주봅니다. 첫인상이 강하고 정돈돼 보입니다.',
   use:'브랜드 소개 첫 화면, 로그인·회원가입, 채용 공고',
   avoid:'섹션이 많을 때. 같은 구조가 반복되면 단조로워집니다',
   ex:'에어비앤비 호스트 소개, 각종 SaaS 로그인 화면',
   tip:'왼쪽 사진은 <b>인물이나 공간</b>처럼 여백이 있는 컷이 좋습니다',
   sec:'1~4개 섹션', mob:'세로로 쌓임 (사진 위 / 글 아래)'}
};
function infoRows(rows){
  return rows.filter(function(r){return r[1];}).map(function(r){
    return '<div class="ir"><span class="ik">'+r[0]+'</span><span class="iv">'+r[1]+'</span></div>';
  }).join('');
}
function renderLayPrev(){
  const v=$('#selLayout').value, d=LAYPREV[v]||LAYPREV.alt;
  $('#layPrev').innerHTML=d.w;
  $('#layInfo').innerHTML='<div style="font-size:14px;color:var(--ui-fg-strong);margin-bottom:5px">'+d.n+'</div>'
    +'<div style="font-size:11.5px;color:var(--ui-fg-lower);line-height:1.7;margin-bottom:6px">'+d.c+'</div>'
    +infoRows([['추천',d.use],['주의',d.avoid],['사례',d.ex],['팁',d.tip]])
    +'<div class="metarow"><span>'+d.sec+'</span><span>'+d.mob+'</span></div>';
}
function build(silent){
  const s=SYS[+$('#selSys').value], lay=$('#selLayout').value, dark=$('#darkMode').checked;
  const secs=cur.s.map((x,k)=>({t:x[0],d:x[1],k})).filter(x=>picked.has(x.k));
  const showSpec=$('#rImg').checked, motion=$('#rMotion').checked, a11y=$('#rA11y').checked;
  const bg = dark? s.g[5] : '#FFFFFF', canvas = dark? '#0E0E11' : s.g[0];
  const fg = dark? '#FFFFFF' : s.g[5], fgLow = dark? s.g[2] : s.g[3], border = dark? s.g[4] : s.g[2];
  const prim = dark? s.p : s.p, primLow = dark? s.g[4] : s.pl;

  const bN=$('#bName').value.trim(), bT=$('#bTag').value.trim();
  let body='';
  secs.forEach((sec,i)=>{
    const sp=imgSpec(sec.t);
    const ph = sp ? '<div class="ph" style="aspect-ratio:'+sp.ar+'">'
        + (showSpec? '<span class="phl">'+esc(sp.label)+'</span><span class="phs">'+esc(sp.size)+'</span>' : '<span class="phl">이미지</span>')
        + '</div>' : '';
    const hTitle = (i===0 && bN) ? bN : sec.t;
    const hDesc  = (i===0 && bT) ? bT : sec.d;
    const txt = '<div class="tx"><span class="num">'+(i===0&&bN?esc(sec.t):String(i+1).padStart(2,'0'))+'</span>'
        + '<h2>'+esc(hTitle)+'</h2><p>'+esc(hDesc)+'</p>'
        + (i===0? '<div class="cta"><a class="btn" href="#">자세히 보기</a><a class="btn2" href="#">문의하기</a></div>':'')
        + '</div>';
    const cls = lay==='alt' ? (i%2? 'sec alt':'sec') : lay==='center'? 'sec narrow' : lay==='split'? 'sec split':'sec stack';
    body += '\n  <!-- '+(i+1)+'. '+sec.t+' -->\n  <section class="'+cls+'"'+(motion?' data-rv':'')+'>\n    <div class="inner">'
         + (ph && lay!=='center' ? ph : '') + txt + (ph && lay==='center' ? ph : '') + '</div>\n  </section>';
  });

  const css = [
'    :root{',
'      --primary: '+prim+';  --primary-low: '+primLow+';  --primary-dark: '+s.pd+';',
'      --bg: '+bg+';  --canvas: '+canvas+';  --fg: '+fg+';  --fg-low: '+fgLow+';  --border: '+border+';',
'      --r-btn: '+(s.r===999?'999px':s.r+'px')+';  --r-card: '+s.rc+'px;',
'      --font: '+s.f+';',
'      --pad: clamp(24px, 5vw, 80px);',
'      --w: min(1200px, 92vw);',
'    }',
'    *{box-sizing:border-box;}',
'    body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--font);line-height:1.65;',
'      -webkit-font-smoothing:antialiased;}',
'    .sec{padding:var(--pad) 0;}',
'    .sec:nth-child(even){background:var(--bg);}',
'    .inner{width:var(--w);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center;}',
'    .sec.alt .inner{direction:rtl;} .sec.alt .inner>*{direction:ltr;}',
'    .sec.stack .inner,.sec.narrow .inner{grid-template-columns:1fr;}',
'    .sec.narrow .inner{width:min(760px,92vw);text-align:center;}',
'    .sec.narrow .cta{justify-content:center;}',
'    .ph{width:100%;background:var(--primary-low);border:1px dashed var(--border);border-radius:var(--r-card);',
'      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--primary-dark);}',
'    .phl{font-size:clamp(13px,1.6vw,15px);font-weight:700;}',
'    .phs{font-size:12px;opacity:.75;font-family:ui-monospace,Menlo,monospace;}',
'    .num{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--primary);}',
'    h2{font-size:clamp(20px,3.2vw,38px);line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px;}',
'    p{font-size:clamp(14px,1.6vw,17px);color:var(--fg-low);margin:0;}',
'    .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}',
'    .btn,.btn2{display:inline-block;padding:12px 22px;border-radius:var(--r-btn);font-weight:700;font-size:15px;text-decoration:none;}',
'    .btn{background:var(--primary);color:#fff;}',
'    .btn2{background:var(--primary-low);color:var(--primary-dark);}',
a11y?'    a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}':'',
'    @media(max-width:768px){ .inner{grid-template-columns:1fr!important;} .sec.alt .inner{direction:ltr;} }',
motion?'    [data-rv]{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;}\n    [data-rv].in{opacity:1;transform:none;}\n    @media(prefers-reduced-motion:reduce){[data-rv]{opacity:1;transform:none;transition:none;}}':''
].filter(Boolean).join('\n');

  const js = motion ? '\n<script>\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});\ndocument.querySelectorAll("[data-rv]").forEach(el=>io.observe(el));\n<\/script>' : '';

  html = '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>'+esc(bN || cur.n)+'</title>\n'
    + '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">\n'
    + '<style>\n'+css+'\n</style>\n</head>\n<body>'+body+'\n'+js+'\n</body>\n</html>';

  $('#frame').srcdoc=html;
  $('#codeBody').textContent=html;
  $('#promptBody').textContent=prompt(s,lay,secs,css);
  if(!silent) toast('생성 완료, 섹션 '+secs.length+'개');
}
function prompt(s,lay,secs,css){
  const layName={alt:'모듈러 그리드(좌우 지그재그). 홀수 행은 이미지 왼쪽, 짝수 행은 오른쪽',
                 stack:'단일 열. 위에서 아래로 순서대로',
                 center:'가운데 정렬. min(760px,92vw) 좁은 폭, 텍스트 중앙',
                 split:'Split. 이미지와 텍스트 반반 고정'}[lay];
  const L=[];
  const b=brief();
  L.push('# '+((b.n&&b.n.trim())||cur.n)+' 제작 요청');
  L.push('');
  L.push('아래 스펙 그대로 **단일 HTML 파일**을 만들어줘. 값은 임의로 바꾸지 말고 그대로 쓸 것.');
  L.push('');
  if((b.n&&b.n.trim())||(b.t&&b.t.trim())||(b.m&&b.m.trim())){
    L.push('## 0) 실제 프로젝트 정보 (이 내용으로 카피를 써 줘)');
    if(b.n&&b.n.trim()) L.push('- 이름: '+b.n.trim());
    if(b.t&&b.t.trim()) L.push('- 한 줄 소개: '+b.t.trim());
    if(b.m&&b.m.trim()){
      L.push('- 참고 자료:');
      L.push('```');
      L.push(b.m.trim());
      L.push('```');
    }
    L.push('');
    L.push('**중요**: 아래 섹션 설명은 "무엇을 넣을지"에 대한 안내다. 실제 문구는 위 자료를 근거로 쓰고,');
    L.push('자료에 없는 수치·효능·인증은 지어내지 말 것. 부족하면 자리표시자로 남기고 무엇이 필요한지 표시할 것.');
    L.push('');
  }
  L.push('## 1) 레이아웃');
  L.push('- '+layName);
  L.push('- 참고 사이트: '+cur.refs);
  L.push('');
  L.push('## 2) 섹션 (이 순서 그대로, 각 섹션 앞에 주석)');
  secs.forEach(function(x,i){
    const sp=imgSpec(x.t);
    L.push('');
    L.push((i+1)+'. **'+x.t+'**');
    L.push('   - 내용: '+x.d);
    L.push('   - 마크업: <section class="'+(lay==='alt'?(i%2?'sec alt':'sec'):lay==='center'?'sec narrow':lay==='split'?'sec split':'sec stack')+'"> > .inner');
    if(sp){
      L.push('   - 이미지 슬롯: '+sp.label+' · 권장 '+sp.size+' · aspect-ratio: '+sp.ar);
      L.push(', <div class="ph" style="aspect-ratio:'+sp.ar+'"> 안에 라벨과 규격 텍스트를 표시 (실제 이미지 없이 플레이스홀더)');
    } else {
      L.push('   - 이미지 없음 (텍스트 블록만)');
    }
    if(i===0) L.push('   - 이 섹션에만 CTA 버튼 2개 (.btn 기본 / .btn2 보조)');
  });
  L.push('');
  L.push('## 3) 디자인 토큰 '+s.n+' (아래 CSS를 그대로 사용)');
  L.push('```css');
  L.push(css);
  L.push('```');
  L.push('');
  L.push('## 4) 규칙');
  rulesText().forEach(function(r){L.push(r);});
  L.push('');
  L.push('## 5) 출력 형식');
  L.push('- 의존성 없는 단일 HTML 파일 (Pretendard CDN 링크만 허용)');
  L.push('- 위 CSS를 <style>에 그대로 넣고, 섹션 마크업만 추가');
  L.push('- 클래스명: .sec / .sec.alt / .sec.narrow / .sec.stack / .inner / .ph / .phl / .phs / .tx / .num / .cta / .btn / .btn2');
  L.push('- 이미지는 전부 플레이스홀더(.ph)로, 실제 파일 참조 금지');
  return L.join('\n');
}

/* ===== 배선 ===== */
const auto=()=>{try{build(true);}catch(e){}};
['#selPage','#selLayout','#selSys','#darkMode','#rRes','#rImg','#rA11y','#rBan','#rMotion'].forEach(function(id){
  const el=$(id); if(el) el.addEventListener('change',auto);
});
$('#selLayout').addEventListener('change',renderLayPrev);
$('#secPick').addEventListener('change',auto);
['#bName','#bTag','#bMat'].forEach(function(id){
  const el=$(id); if(el) el.addEventListener('input',function(){ saveBrief(); clearTimeout(el._t); el._t=setTimeout(auto,350); });
});
$('#exBtns').onclick=function(e){
  const b=e.target.closest('[data-ex]'); if(!b) return;
  const k=b.dataset.ex;
  if(k==='clear'){ $('#bName').value=''; $('#bTag').value=''; $('#bMat').value=''; }
  else { const x=EX[k]; $('#bName').value=x.n; $('#bTag').value=x.t; $('#bMat').value=x.m; }
  saveBrief(); auto();
};
$('#myList').addEventListener('click',()=>setTimeout(auto,0));
$('#ruleAdd').addEventListener('click',()=>setTimeout(auto,0));
$('#viewTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $('#viewTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.v;
  $('#paneP').style.display=v==='preview'?'':'none';
  $('#paneC').style.display=v==='code'?'':'none';
  $('#paneR').style.display=v==='prompt'?'':'none';};
$('#devBar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $('#devBar').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const f=$('#frame'); f.style.width=b.dataset.w; f.style.margin=b.dataset.w==='100%'?'':'0 auto'; f.style.display='block';};
$('#cpCode').onclick=()=>copy(html,'HTML 복사됨');
$('#cpPrompt').onclick=()=>copy($('#promptBody').textContent,'프롬프트 복사됨');
$('#btnDown').onclick=()=>{if(!html){toast('먼저 생성하세요');return;}
  const b=new Blob([html],{type:'text/html;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=cur.n.replace(/[^\w가-힣]/g,'_')+'.html'; a.click(); toast('저장됨');};
$('#btnOpen').onclick=()=>{
  if(!html){toast('먼저 생성하세요');return;}
  // 팝업이 막히면 window.open 은 null 을 돌려준다.
  // 그대로 쓰면 오류로 멈추므로 대신 파일로 내려준다.
  let w=null;
  try{ w=window.open('','_blank'); }catch(e){}
  if(w && w.document){ w.document.write(html); w.document.close(); return; }
  const b=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=(brief().n||'page')+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('새 탭이 막혔습니다. 파일로 내려받았습니다');
};
$('#btnUi').onclick=()=>{const r=document.documentElement;r.setAttribute('data-ui',r.getAttribute('data-ui')==='dark'?'light':'dark');};

(function(){ const b=brief();
  if(b.n) $('#bName').value=b.n; if(b.t) $('#bTag').value=b.t; if(b.m) $('#bMat').value=b.m;
})();
loadPage(0); renderMy(); renderLayPrev(); build();

<style>
/* src/kit.css */
/* ===========================================================
   Design System Kit 셸 스타일시트

   화면 다섯 개가 함께 쓰는 한 벌이다. 화면마다 따로 정의하지 않는다.
   값은 monopo saigon 토큰 원본(refero 추출본)을 그대로 쓴다.

   각 화면의 <style> 뒤에 실려서 같은 선택자면 이 파일이 이긴다.
   !important 는 쓰지 않는다. 깊은 선택자를 덮어야 할 때는
   클래스를 두 번 적어(.chip.chip) 우선순위만 올린다.

   미리보기 영역(.demo 안쪽)은 각 시스템 고유 토큰이 지배한다.
   이 파일은 그 안쪽을 건드리지 않는다.
   =========================================================== */

/* ---------- 토큰 ---------- */
:root{
  --obsidian:#000000;
  --paper:#ffffff;
  --inkstone:#181818;
  --felt-gray:#6d6d6d;
  --slate-pill:#636363;
  --ash-mist:#9a9a9a;

  --iridescent:linear-gradient(90deg,rgb(160,224,171),rgb(255,172,46) 50%,rgb(165,45,37));

  --sp-8:8px; --sp-12:12px; --sp-28:28px; --sp-40:40px;
  --sp-48:48px; --sp-64:64px; --sp-68:68px; --sp-152:152px;

  --page-max:1078px;
  --section-gap:46px;
  --card-pad:34px;
  --el-gap:14px;

  --r-pill:75px;
  --r-flat:0px;
  --hair:1px;
  --ease:cubic-bezier(.19,1,.22,1);

  /* 글자 단. 제목 행간은 스펙 값, 본문 행간은 한글에 맞춰 연다.

  --t-eyebrow:11px;  --lh-eyebrow:1.36;
  --t-caption:12px;  --lh-caption:1.5;
  --t-small:14px;    --lh-small:1.6;
  --t-body:16px;     --lh-body:1.6;
  --t-lead:18px;     --lh-lead:1.6;
  --t-card:20px;     --lh-card:1.35;
  --t-sub:29px;      --lh-sub:1.3;
  --t-sec:39px;      --lh-sec:1.19;
  --t-head:78px;     --lh-head:1.1;

  --font-sans:"Inter","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}

:root,
:root[data-theme="light"],
:root[data-ui="light"]{
  --ui-canvas:var(--paper);
  --ui-panel:var(--paper);
  --ui-panel-2:#F4F4F4;

  --ui-fg-lower:var(--felt-gray);

  --ui-border-low:#F0F0F0;

  --ui-accent:var(--obsidian);

  --ui-sh:none; --ui-sh-md:none;
}

:root[data-theme="dark"],
:root[data-ui="dark"]{

  --ui-panel:var(--obsidian);

  --ui-fg:var(--paper);
  --ui-fg-strong:var(--paper);
  --ui-fg-lower:var(--ash-mist);
  /* 검정 바탕에서 Felt Gray 는 4.06 대 1 이라 기준에 못 미친다 */

  --ui-border:rgba(255,255,255,.22);
  --ui-border-low:rgba(255,255,255,.12);
  --ui-line:rgba(255,255,255,.75);

/* ---------- 바탕과 한글 줄바꿈 ----------

body{

.cgo,.gbtn,.gobtn{
  border-radius:var(--r-pill);

  background:var(--ui-fg-strong);

  border:var(--hair) solid var(--ui-fg-strong);

}
.iconbtn:hover{ border-color:var(--ui-line); color:var(--ui-fg-strong); }
/* 어두운 코드 상자 위의 복사 버튼 */
.copy{
  border-radius:var(--r-pill);

}

/* ---------- 태그는 고스트 알약 ---------- */
.pill,.count,.stats span{

  color:var(--ui-fg-lower);
  font-weight:400;
  font-size:var(--t-caption);
  padding:5px 14px;
  box-shadow:none;

/* ---------- 면은 직각, 그림자 없음 ---------- */
.card,.panel,.out,.stage,.frame,.search,.searchbar,.composer,.cout,.export,
.note,.infobox,.dscard,.addcard,.lcard,.rec,.foldbody,.specview,.specta,
.rulebox,.myrules,.qa,.case,.file,.c,.st,.preview,.gcard,.layprev,.brief,
.autoinfo,.cwrap,.selectbox,.sel,.step,.dsec,.warn,.tip{
  border-radius:var(--r-flat);
  box-shadow:none;

  border:var(--hair) solid var(--ui-border);
}
.dscard,.lcard,.rec,.c,.file,.qa,.case{

  transition:border-color .8s var(--ease);
}
.dscard:hover,.lcard:hover,.rec:hover,.c:hover,.file:hover{

}
.export,.cout{ background:var(--obsidian); color:var(--paper); }

/* ---------- 간격 ---------- */
.wrap{ max-width:var(--page-max); }
.sectitle{ margin-top:var(--section-gap); }
.cards,.steps,.recs,.lwrap{ gap:var(--el-gap); }

/* ---------- 미리보기 영역은 각 시스템 토큰이 지배한다 ---------- */
#detail .demo,#detail .demo *,

@media(prefers-reduced-motion:reduce){

/* ===========================================================
   화면별 규칙
   선택자는 그 화면에만 있는 이름이라 다른 화면에서는 걸리지 않는다.
   =========================================================== */

/* ---- 시작 화면 ---- */
.lead{ font-size:var(--t-lead); }
.c{ padding:var(--card-pad); }
.c .d{ font-size:var(--t-small); line-height:var(--lh-small); }
.c .go{ color:var(--ui-fg-lower); font-weight:400; font-size:var(--t-caption); }
/* 이 페이지의 유일한 유채색. 글자가 앉는 아래쪽만 눌러 대비를 만든다. */
.c.main{
  background:linear-gradient(180deg,rgba(0,0,0,0) 22%,rgba(0,0,0,.88)),var(--iridescent);
  border-color:transparent;
  padding:var(--sp-152) var(--card-pad) var(--sp-40);
  justify-content:flex-end;
}
.c.main .n{ color:var(--paper); font-size:var(--t-sub); font-weight:300; }
.c.main .d,.c.main .go{ color:rgba(255,255,255,.9); max-width:62ch; }
.c.main .d b{ font-weight:400; color:var(--paper); }
.c.main:hover{ border-color:transparent; }
.st{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.st .n{
  border-radius:var(--r-pill);
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
}
.st .d{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 사용설명서 ---- */
.file,.qa,.case{ padding:var(--card-pad); }
.fd,.q,.a{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 조립기 ---- */
.swatchpick,.ramp,.rl{ border-radius:var(--r-flat); }
.seg{
  border-radius:var(--r-pill);
  padding:3px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);
}
.hint,.psub{ font-size:var(--t-caption); color:var(--ui-fg-lower); }

/* ---- 생성기 ---- */
.lbl{
  font-size:var(--t-caption);
  color:var(--ui-fg-lower);
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* ---- 모음집 ---- */
.composer{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.dscard .body{ padding:var(--card-pad); }
.dscard .desc{ font-size:var(--t-small); line-height:var(--lh-small); }
.dscard .cover{ border-bottom:var(--hair) solid var(--ui-border); }
.backbar{ border-bottom:var(--hair) solid var(--ui-border); }

.dhead,.crumbs,.refbar,.dnav{

.specview{

}

/* ---- 화면 자체 CSS 가 더 깊은 선택자로 잡아 둔 자리 ----
   같은 깊이로 다시 적어 킷 값이 적용되게 한다. */
.composer h3,.panel h2,.sec h2{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
  color:var(--ui-fg-strong);
}
.composer .csub{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 복사한 다음 할 일 ---- */
.cnext{

  padding:12px 16px;
  border:var(--hair) solid var(--ui-line);
  border-radius:var(--r-flat);
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-strong);

}

.noresult{

/* ---- 키보드로 닿는 자리를 보이게 ----
   킷이 접근성을 가르치면서 정작 자기 화면에는 초점 표시가 없었다.
   카드는 button 이 아니라 div 라 role 과 tabindex 로 닿게 해 뒀다. */
:focus-visible{
  outline:2px solid var(--ui-line);
  outline-offset:2px;
}
.dscard[role="button"],.lcard[role="button"],.rec[role="button"],.logo[role="button"]{
  cursor:pointer;
}
.dscard:focus-visible,.lcard:focus-visible,.rec:focus-visible{
  outline:2px solid var(--ui-line);
  outline-offset:-2px;
  border-color:var(--ui-line);
}
/* 마우스로 누를 때는 테두리를 그리지 않는다 */
.dscard:focus:not(:focus-visible),.lcard:focus:not(:focus-visible),
.rec:focus:not(:focus-visible),.logo:focus:not(:focus-visible){ outline:none; }

/* 터치로 누르는 자리는 44px 이상 */
@media(pointer:coarse){
  .tbtn,.filterchip,.backbtn,.tabs button,.dtabs button,.appnav a,.iconbtn,.seg button{
    min-height:44px;
  }
}

/* ---- 강조 버튼. 바탕과 글자가 같은 색이 되지 않게 짝으로 둔다 ----
   화면 CSS 는 color:#fff 로 박아 둬서 다크 모드에서 흰 바탕에 흰 글씨가 됐다. */
.tbtn.pri,.gbtn.pri,.fstep .n,.st .n{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
  font-weight:400;
}
.tbtn.pri{ border-radius:var(--r-pill); }

/* ---- 좁은 화면에서 상단 바가 가로로 넘치지 않게 ---- */
@media(max-width:768px){
  .top,.topbar{ flex-wrap:wrap; row-gap:8px; }
  .appnav{ order:10; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .appnav::-webkit-scrollbar{ height:0; }
  .top .sp,.topbar .spacer{ flex:1 1 auto; }
}

/* ---- 대비를 보장하는 자리 ---- */

/* 카드 표지의 글꼴 미리보기는 시스템 색 띠 위에 올라간다.

.autoinfo,.hint,.psub,.grouphint,.note,.foldbody .hint{ color:var(--ui-fg-lower); }

/* 규칙 추가 버튼과 주의 상자 제목 */
.ruleadd button{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border:var(--hair) solid var(--ui-fg-strong);
  border-radius:var(--r-pill);
  font-weight:400;
}
.warn .th,.tip .th{ color:var(--ui-fg-strong); font-weight:400; }
</style>

<script>
(function(){
  var NAMES=['index','library','builder','generator','guide'];
  var stage=document.getElementById('stage'), boot=document.getElementById('boot');
  var cur='', curQ='';

  function read(name){
    var el=document.getElementById('f-'+name);
    return el ? el.textContent.split('\ue000').join('<\/script') : '';
  }
  function parseHash(){
    var h=(location.hash||'').replace(/^#/,'');
    var i=h.indexOf('?');
    var n=i<0?h:h.slice(0,i), q=i<0?'':h.slice(i+1);
    if(NAMES.indexOf(n)<0) n='index';
    return [n,q];
  }
  function show(name,q,push){
    if(NAMES.indexOf(name)<0) name='index';
    cur=name; curQ=q||'';
    var html=read(name);
    if(!html){ boot.textContent='화면을 찾지 못했습니다: '+name; return; }
    stage.srcdoc=html;
    if(boot) boot.style.display='none';
    var hash='#'+name+(curQ?'?'+curQ:'');
    if(push!==false && location.hash!==hash) location.hash=hash;
    document.title=({index:'Design System Kit',library:'모음집',builder:'조립기',
                     generator:'생성기',guide:'사용설명서'}[name])
                   +(name==='index'?'':' · Design System Kit');
  }

  var skipNext=false;

  window.dsk={
    go:function(name,q){ show(name,q,true); },
    q:function(){ return curQ; },
    current:function(){ return cur; },
    // 화면 안에서 보던 자리가 바뀌었을 때 주소만 갱신한다.
    // 화면을 다시 싣지 않아 스크롤과 입력이 남는다.
    setQuery:function(q){
      curQ=q||'';
      var h='#'+cur+(curQ?'?'+curQ:'');
      if(location.hash!==h){ skipNext=true; location.hash=h; }
    }
  };

  window.addEventListener('hashchange',function(){
    if(skipNext){ skipNext=false; return; }
    var p=parseHash();
    if(p[0]!==cur||p[1]!==curQ) show(p[0],p[1],false);
  });

  try{ var t=localStorage.getItem('dsk_ui'); if(t) document.documentElement.setAttribute('data-ui',t); }catch(e){}
  var p=parseHash(); show(p[0],p[1],false);
})();
</script>
