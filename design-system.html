<script type="text/html" id="f-index"><!doctype html>
<html lang="ko" data-ui="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design System Kit, 디자인 시스템 도구</title>
<meta name="description" content="디자인 시스템 17종, 레이아웃 22종, 콘텐츠 구조 9종을 보관하고 AI 프롬프트·CLAUDE.md·CSS 토큰·실제 페이지까지 만들어내는 로컬 도구.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root,:root[data-ui="light"]{
  --ui-canvas:#F6F5F2;--ui-panel:#FFFFFF;--ui-panel-2:#F2F0EB;
  --ui-fg:#17161B;--ui-fg-strong:#2A2830;--ui-fg-lower:#5E5A63;--ui-fg-dim:#A9A6AE;
  --ui-border:#E7E4DD;--ui-accent:#A24E38;
  --ui-sh:0 1px 3px rgba(30,24,50,.06);--ui-sh-md:0 8px 26px rgba(30,24,50,.10);
}
*{box-sizing:border-box;}
body{margin:0;-webkit-font-smoothing:antialiased;}
.top{display:flex;align-items:center;gap:12px;}
.logo{font-family:"Space Grotesk",Pretendard,sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.mk{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 140deg,#A24E38,#C98A5B,#3F5E56,#A24E38);}
.sp{flex:1;}
.tbtn{cursor:pointer;font:inherit;text-decoration:none;}
.wrap{margin:0 auto;padding:clamp(34px,7vw,70px) clamp(18px,4vw,32px) 80px;}
.lead{margin:0 0 10px;}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 34px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.c{background:var(--ui-panel);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:7px;}
.c:hover{box-shadow:var(--ui-sh-md);}
.c .ic{font-size:24px;}
.c .n{color:var(--ui-fg-strong);}
.c .d{color:var(--ui-fg-lower);flex:1;}
.c.main{grid-column:1/-1;}

h2{margin:48px 0 8px;padding-bottom:10px;border-bottom:2px solid var(--ui-fg-strong);}
.steps{display:flex;flex-wrap:wrap;margin-top:16px;}
.st{flex:1;min-width:190px;background:var(--ui-panel);}
.st .n{display:inline-grid;place-items:center;width:22px;height:22px;font-size:11px;font-weight:800;margin-bottom:7px;}
.st .t{color:var(--ui-fg-strong);}
.st .d{color:var(--ui-fg-lower);margin-top:3px;}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--ui-border);font-size:12px;color:var(--ui-fg-dim);}
</style>
</style>
<style>
/* src/kit.css */
/* ===========================================================
   Design System Kit 셸 스타일시트

   화면 다섯 개가 함께 쓰는 한 벌이다. 화면마다 따로 정의하지 않는다.
   값은 monopo saigon 토큰 원본(refero 추출본)을 그대로 쓴다.

   각 화면의 <style> 뒤에 실려서 같은 선택자면 이 파일이 이긴다.
   !important 는 쓰지 않는다. 깊은 선택자를 덮어야 할 때는
   클래스를 두 번 적어(.chip.chip) 우선순위만 올린다.

   미리보기 영역(.demo 안쪽)은 각 시스템 고유 토큰이 지배한다.
   이 파일은 그 안쪽을 건드리지 않는다.
   =========================================================== */

/* ---------- 토큰 ---------- */
:root{
  --obsidian:#000000;
  --paper:#ffffff;
  --inkstone:#181818;
  --felt-gray:#6d6d6d;
  --slate-pill:#636363;
  --ash-mist:#9a9a9a;
  --pewter:#808080;
  --iridescent:linear-gradient(90deg,rgb(160,224,171),rgb(255,172,46) 50%,rgb(165,45,37));

  --sp-8:8px; --sp-12:12px; --sp-28:28px; --sp-40:40px;
  --sp-48:48px; --sp-64:64px; --sp-68:68px; --sp-152:152px;

  --page-max:1078px;
  --section-gap:46px;
  --card-pad:34px;
  --el-gap:14px;

  --r-pill:75px;
  --r-flat:0px;
  --hair:1px;
  --ease:cubic-bezier(.19,1,.22,1);

  /* 글자 단. 제목 행간은 스펙 값, 본문 행간은 한글에 맞춰 연다.
     스펙의 본문 1.15~1.21 은 라틴 기준이라 한글에서 줄이 붙는다. */
  --t-eyebrow:11px;  --lh-eyebrow:1.36;
  --t-caption:12px;  --lh-caption:1.5;
  --t-small:14px;    --lh-small:1.6;
  --t-body:16px;     --lh-body:1.6;
  --t-lead:18px;     --lh-lead:1.6;
  --t-card:20px;     --lh-card:1.35;
  --t-sub:29px;      --lh-sub:1.3;
  --t-sec:39px;      --lh-sec:1.19;
  --t-head:78px;     --lh-head:1.1;

  --font-sans:"Inter","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --font-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}

:root,
:root[data-theme="light"],
:root[data-ui="light"]{
  --ui-canvas:var(--paper);
  --ui-panel:var(--paper);
  --ui-panel-2:#F4F4F4;
  --ui-fg:var(--obsidian);
  --ui-fg-strong:var(--obsidian);
  --ui-fg-lower:var(--felt-gray);
  /* Ash Mist 와 Pewter 는 스펙에서 테두리와 비활성 면에 쓰라고 한 값이다.
     흰 바탕에서 2.81 대 1 이라 글자에 쓰면 읽히지 않는다. 글자에는 4.5 를 넘는 값을 쓴다. */
  --ui-fg-dim:#767676;
  --ui-border:#E3E3E3;
  --ui-border-low:#F0F0F0;
  --ui-line:var(--obsidian);
  --ui-accent:var(--obsidian);
  --ui-shadow-sm:none; --ui-shadow-md:none; --ui-shadow-lg:none;
  --ui-sh:none; --ui-sh-md:none;
}

:root[data-theme="dark"],
:root[data-ui="dark"]{
  --ui-canvas:var(--obsidian);
  --ui-panel:var(--obsidian);
  --ui-panel-2:var(--inkstone);
  --ui-fg:var(--paper);
  --ui-fg-strong:var(--paper);
  --ui-fg-lower:var(--ash-mist);
  /* 검정 바탕에서 Felt Gray 는 4.06 대 1 이라 기준에 못 미친다 */
  --ui-fg-dim:#8a8a8a;
  --ui-border:rgba(255,255,255,.22);
  --ui-border-low:rgba(255,255,255,.12);
  --ui-line:rgba(255,255,255,.75);
  --ui-accent:var(--paper);
  --ui-shadow-sm:none; --ui-shadow-md:none; --ui-shadow-lg:none;
  --ui-sh:none; --ui-sh-md:none;
}

/* ---------- 바탕과 한글 줄바꿈 ----------
   브라우저 기본값은 한글을 글자 단위로 끊어 단어가 쪼개진다.
   단어 단위로 바뀌게 처음부터 지정한다. */
body{
  font-family:var(--font-sans);
  font-size:var(--t-body);
  line-height:var(--lh-body);
  letter-spacing:-.005em;
  word-break:keep-all;
  overflow-wrap:break-word;
  line-break:strict;
  background:var(--ui-canvas);
  color:var(--ui-fg);
}
h1,h2,h3,h4,.sectitle,.dt2,.dt3,.gtitle,.ct,.hero h1{ text-wrap:balance; }
p,.lead,.dsc,.csub,.secsub,.desc,.d{ text-wrap:pretty; }

.mono,code,pre,.specview,.specta{ font-family:var(--font-mono); }
a{ text-decoration:none; color:inherit; }

/* ---------- 글자 단 ---------- */
h1,.hero h1{
  font-family:var(--font-sans);
  font-weight:300;
  font-size:clamp(34px,5.4vw,var(--t-head));
  line-height:var(--lh-head);
  letter-spacing:-.035em;
  margin:0 0 var(--sp-28);
  color:var(--ui-fg-strong);
}
h2,.sectitle,.dt2,.gtitle{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-sub);
  line-height:var(--lh-sub);
  letter-spacing:-.025em;
}
h3,.dt3,.ct{
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
}
.dscard h3,.c .n,.st .t{
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
}
.lead,.hero p,.csub,.secsub,.dsc{
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-lower);
  max-width:74ch;
}
.en{
  font-size:var(--t-eyebrow);
  line-height:var(--lh-eyebrow);
  font-weight:400;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ui-fg-dim);
}
/* 45px 위로는 굵게 쓰지 않는다. 본문 강조는 굵기 대신 색으로 준다. */
h1 b,h1 strong,h2 b,h2 strong{ font-weight:400; }
.lead b,.lead strong,.hero p b,.csub b,.secsub b,
.dsc b,.dsc strong,.c .d b,.st .d b{
  font-weight:400;
  color:var(--ui-fg-strong);
}

/* ---------- 상단 바 ---------- */
.top,.topbar{
  border-bottom:var(--hair) solid var(--ui-border);
  background:var(--ui-canvas);
  backdrop-filter:none;
  padding:var(--sp-12) var(--sp-28);
}
.topbar .logo,.top .logo{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-body);
  letter-spacing:-.02em;
}
.topbar .logo .mk,.top .logo .mk,.mk.mk{
  border-radius:var(--r-flat);
  background:var(--ui-fg-strong);
  width:20px;
  height:20px;
}
.topbar .logo .dim,.top .logo .dim{ color:var(--ui-fg-dim); font-weight:400; }

.appnav{
  background:transparent;
  border:0;
  border-radius:var(--r-flat);
  padding:0;
  gap:var(--sp-8);
}
.appnav a{
  border:var(--hair) solid transparent;
  border-radius:var(--r-pill);
  font-weight:400;
  font-size:var(--t-small);
  padding:7px 16px;
  color:var(--ui-fg-lower);
  transition:color .4s ease,border-color .4s ease;
}
.appnav a:hover{
  background:transparent;
  border-color:var(--ui-border);
  color:var(--ui-fg-strong);
}
.appnav a.on{
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
}

/* ---------- 조작부. 알약은 행동에만 쓴다 ---------- */
.tbtn,.filterchip,.backbtn,.morebtn,.cbtn,
.tabs button,.dtabs button,.seg button,.exbtns button{
  border-radius:var(--r-pill);
  box-shadow:none;
  font-weight:400;
  font-size:var(--t-small);
  padding:9px 20px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);
  color:var(--ui-fg-lower);
  transition:color .4s ease,border-color .4s ease,background .4s ease;
}
.tbtn:hover,.filterchip:hover,.backbtn:hover,
.tabs button:hover,.dtabs button:hover{
  border-color:var(--ui-line);
  color:var(--ui-fg-strong);
}
.filterchip.on,.tabs button.on,.dtabs button.on,.seg button.on{
  font-weight:400;
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border-color:transparent;
}
.cgo,.gbtn,.gobtn{
  border-radius:var(--r-pill);
  box-shadow:none;
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
  border:var(--hair) solid var(--ui-fg-strong);
  font-weight:400;
  font-size:var(--t-body);
  padding:11px 33px;
}
.iconbtn{
  font-family:var(--font-sans);
  font-weight:400;
  border-radius:var(--r-pill);
  box-shadow:none;
  width:auto;
  min-width:36px;
  height:36px;
  padding:0 14px;
  border:var(--hair) solid var(--ui-border);
  background:transparent;
  color:var(--ui-fg-lower);
  font-size:var(--t-caption);
}
.iconbtn:hover{ border-color:var(--ui-line); color:var(--ui-fg-strong); }
/* 어두운 코드 상자 위의 복사 버튼 */
.copy{
  border-radius:var(--r-pill);
  background:var(--paper);
  color:var(--obsidian);
  border:var(--hair) solid var(--paper);
  font-weight:400;
  font-size:var(--t-caption);
  padding:7px 16px;
  box-shadow:none;
}

/* ---------- 태그는 고스트 알약 ---------- */
.pill,.count,.stats span{
  border-radius:var(--r-pill);
  background:transparent;
  border:var(--hair) solid var(--ui-border);
  color:var(--ui-fg-lower);
  font-weight:400;
  font-size:var(--t-caption);
  padding:5px 14px;
  box-shadow:none;
}

/* ---------- 면은 직각, 그림자 없음 ---------- */
.card,.panel,.out,.stage,.frame,.search,.searchbar,.composer,.cout,.export,
.note,.infobox,.dscard,.addcard,.lcard,.rec,.foldbody,.specview,.specta,
.rulebox,.myrules,.qa,.case,.file,.c,.st,.preview,.gcard,.layprev,.brief,
.autoinfo,.cwrap,.selectbox,.sel,.step,.dsec,.warn,.tip{
  border-radius:var(--r-flat);
  box-shadow:none;
}
.search,.searchbar,.cwrap,.selectbox,.sel{
  border:var(--hair) solid var(--ui-border);
}
.dscard,.lcard,.rec,.c,.file,.qa,.case{
  border:var(--hair) solid var(--ui-border);
  transition:border-color .8s var(--ease);
}
.dscard:hover,.lcard:hover,.rec:hover,.c:hover,.file:hover{
  transform:none;
  border-color:var(--ui-line);
}
.export,.cout{ background:var(--obsidian); color:var(--paper); }

/* ---------- 간격 ---------- */
.wrap{ max-width:var(--page-max); }
.sectitle{ margin-top:var(--section-gap); }
.cards,.steps,.recs,.lwrap{ gap:var(--el-gap); }

/* ---------- 미리보기 영역은 각 시스템 토큰이 지배한다 ---------- */
#detail .demo,#detail .demo *,
#sview .demo,#sview .demo *{
  border-radius:revert;
  font-family:revert;
  font-size:revert;
  line-height:revert;
  letter-spacing:revert;
}

@media(prefers-reduced-motion:reduce){
  *{ transition-duration:.01ms; animation-duration:.01ms; }
}
@media(max-width:768px){
  :root{ --card-pad:20px; --section-gap:32px; }
  .top,.topbar{ padding:10px 16px; }
}

/* ===========================================================
   화면별 규칙
   선택자는 그 화면에만 있는 이름이라 다른 화면에서는 걸리지 않는다.
   =========================================================== */

/* ---- 시작 화면 ---- */
.lead{ font-size:var(--t-lead); }
.c{ padding:var(--card-pad); }
.c .d{ font-size:var(--t-small); line-height:var(--lh-small); }
.c .go{ color:var(--ui-fg-lower); font-weight:400; font-size:var(--t-caption); }
/* 이 페이지의 유일한 유채색. 글자가 앉는 아래쪽만 눌러 대비를 만든다. */
.c.main{
  background:linear-gradient(180deg,rgba(0,0,0,0) 22%,rgba(0,0,0,.88)),var(--iridescent);
  border-color:transparent;
  padding:var(--sp-152) var(--card-pad) var(--sp-40);
  justify-content:flex-end;
}
.c.main .n{ color:var(--paper); font-size:var(--t-sub); font-weight:300; }
.c.main .d,.c.main .go{ color:rgba(255,255,255,.9); max-width:62ch; }
.c.main .d b{ font-weight:400; color:var(--paper); }
.c.main:hover{ border-color:transparent; }
.st{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.st .n{
  border-radius:var(--r-pill);
  background:var(--ui-fg-strong);
  color:var(--ui-canvas);
}
.st .d{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 사용설명서 ---- */
.file,.qa,.case{ padding:var(--card-pad); }
.fd,.q,.a{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 조립기 ---- */
.swatchpick,.ramp,.rl{ border-radius:var(--r-flat); }
.seg{
  border-radius:var(--r-pill);
  padding:3px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);
}
.hint,.psub{ font-size:var(--t-caption); color:var(--ui-fg-lower); }

/* ---- 생성기 ---- */
.lbl{
  font-size:var(--t-caption);
  color:var(--ui-fg-lower);
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* ---- 모음집 ---- */
.composer{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }
.dscard .body{ padding:var(--card-pad); }
.dscard .desc{ font-size:var(--t-small); line-height:var(--lh-small); }
.dscard .cover{ border-bottom:var(--hair) solid var(--ui-border); }
.backbar{ border-bottom:var(--hair) solid var(--ui-border); }
/* 구분은 헤어라인만 쓴다. 굵은 줄을 두지 않는다. */
.dhead,.crumbs,.refbar,.dnav{
  border-bottom-width:var(--hair);
  border-bottom-color:var(--ui-border);
}
.dsec{
  border-top:var(--hair) solid var(--ui-border);
  padding-top:var(--section-gap);
  margin-top:var(--section-gap);
}
.dtabs{ gap:var(--sp-8); }
.grouphint{ font-size:var(--t-caption); color:var(--ui-fg-lower); }
.specbar .filterchip{ padding:8px 18px; }
.specview{
  background:var(--ui-panel-2);
  color:var(--ui-fg-lower);
  border:var(--hair) solid var(--ui-border);
  font-size:var(--t-caption);
}

/* ---- 화면 자체 CSS 가 더 깊은 선택자로 잡아 둔 자리 ----
   같은 깊이로 다시 적어 킷 값이 적용되게 한다. */
.composer h3,.panel h2,.sec h2{
  font-family:var(--font-sans);
  font-weight:400;
  font-size:var(--t-card);
  line-height:var(--lh-card);
  letter-spacing:-.02em;
  color:var(--ui-fg-strong);
}
.composer .csub{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 복사한 다음 할 일 ---- */
.cnext{
  margin-top:var(--el-gap);
  padding:12px 16px;
  border:var(--hair) solid var(--ui-line);
  border-radius:var(--r-flat);
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-strong);
  background:var(--ui-panel-2);
}
.scount{ font-size:var(--t-caption); color:var(--ui-fg-dim); white-space:nowrap; }
.noresult{
  grid-column:1/-1;
  padding:var(--sp-64) var(--card-pad);
  border:var(--hair) dashed var(--ui-border);
  text-align:center;
  font-size:var(--t-small);
  line-height:var(--lh-small);
  color:var(--ui-fg-lower);
}

.cbtn{width:100%;display:flex;align-items:center;gap:8px;font:inherit;text-align:left;cursor:pointer;}

.cbtn .cv{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cbtn .cc{color:var(--ui-fg-dim);font-size:11px;}
.copts{position:absolute;z-index:200;top:calc(100% + 5px);left:0;right:0;max-height:290px;overflow-y:auto;
  background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:11px;box-shadow:var(--ui-shadow-lg);
  padding:5px;display:none;}
.copts.open{display:block;}
.copt{padding:8px 11px;border-radius:8px;font-size:13px;color:var(--ui-fg-strong);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.copt:hover,.copt.hl{background:var(--ui-panel-2);}
.copt.sel{background:var(--ui-accent);color:#fff;font-weight:700;}
#hoverPeek{position:fixed;z-index:9999;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  width:280px;background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:14px;box-shadow:var(--ui-shadow-lg);padding:12px;}
#hoverPeek.on{opacity:1;transform:translateY(0);}
#hoverPeek .hw{background:var(--ui-panel-2);border:1px solid var(--ui-border-low);border-radius:9px;height:150px;padding:9px;
  display:flex;flex-direction:column;gap:6px;overflow:hidden;}
#hoverPeek .hw .wb{background:var(--ui-border);border-radius:3px;}
#hoverPeek .hw .wa{background:color-mix(in srgb,var(--ui-accent) 42%,var(--ui-border));border-radius:3px;}
#hoverPeek .hn{font-size:13px;font-weight:800;color:var(--ui-fg-strong);margin-top:9px;}
#hoverPeek .hd{font-size:11.5px;color:var(--ui-fg-lower);line-height:1.6;margin-top:3px;}
#hoverPeek .hs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
#hoverPeek .hs span{font-size:10.5px;font-weight:700;background:var(--ui-panel-2);border:1px solid var(--ui-border);
  color:var(--ui-fg-lower);padding:2px 8px;border-radius:999px;}
.cfield select option{padding:4px;}
.composer{background:var(--ui-panel);margin:22px 0 6px;}
.composer h3{margin:0 0 3px;}
.composer .csub{color:var(--ui-fg-lower);margin-bottom:14px;}
.crow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.cfield{display:flex;flex-direction:column;gap:5px;min-width:190px;flex:1;}
.cfield label{font-size:11.5px;font-weight:700;color:var(--ui-fg-lower);}
.cfield select{font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel-2);color:var(--ui-fg);cursor:pointer;}
.cfield select:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.cgo{font:inherit;cursor:pointer;white-space:nowrap;}
.cgo:hover{filter:brightness(1.08);}
.cout{position:relative;padding:14px;font-family:"Roboto Mono",monospace;font-size:11.5px;line-height:1.6;max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:13px;}
.lcard:hover{box-shadow:var(--ui-shadow-md);}
.lcli{font-size:11px;font-weight:700;color:var(--ui-accent);margin-top:8px;opacity:0;transition:.14s;}
.lcard:hover .lcli{opacity:1;}

/* ---------- Detail ---------- */
.detail{display:none;}.detail.active{display:block;}.catalog.hidden{display:none;}
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.backbtn{font:inherit;cursor:pointer;}
.dhead{border-bottom:2px solid var(--ui-fg-strong);padding-bottom:18px;margin-bottom:6px;}
.dhead h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;}
.dhead .sub{color:var(--ui-fg-lower);font-size:14px;max-width:74ch;}
.dhead .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;}
.dtabs{position:sticky;top:57px;z-index:40;display:flex;flex-wrap:wrap;align-items:center;background:color-mix(in srgb,var(--ui-canvas) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin:14px 0 0;border-bottom:1px solid var(--ui-border);}
.dtabs button{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.dtabs button .cnt{font-size:10.5px;opacity:.6;font-weight:700;}
.dtabs .exp{margin-left:auto;background:var(--ui-accent)!important;color:#fff!important;border-color:transparent!important;}
.dsec.hide{display:none;}
.grouphint{margin:16px 0 -8px;}
.dnav{position:sticky;top:57px;z-index:40;display:flex;flex-wrap:wrap;gap:4px 6px;background:color-mix(in srgb,var(--ui-canvas) 90%,transparent);backdrop-filter:blur(8px);padding:11px 0;margin:14px 0 0;border-bottom:1px solid var(--ui-border);font-size:12.5px;}
.dnav a{color:var(--ui-fg-lower);padding:5px 9px;border-radius:8px;}
.dnav a:hover{background:var(--ui-panel-2);color:var(--ui-fg-strong);}
section.dsec{margin-top:42px;scroll-margin-top:116px;}
h2.dt2{font-size:19px;font-weight:800;margin:0 0 4px;padding-bottom:9px;border-bottom:1px solid var(--ui-border);letter-spacing:-.01em;}
h2.dt2 .en{font-size:12px;font-weight:500;color:var(--ui-fg-dim);margin-left:8px;}
h3.dt3{font-size:14px;font-weight:700;margin:22px 0 9px;color:var(--ui-fg-strong);}
p.dsc{color:var(--ui-fg-lower);font-size:13.5px;margin:8px 0 14px;max-width:80ch;}
ul.dlist{margin:10px 0 0;padding-left:18px;color:var(--ui-fg-lower);font-size:13.5px;max-width:80ch;}
.specbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;}
.specstate{font-size:12.5px;color:var(--ui-fg-lower);margin-right:4px;}
.specta{width:100%;min-height:260px;resize:vertical;font-size:12.5px;line-height:1.6;padding:12px 14px;border:1px solid var(--ui-border);background:var(--ui-panel);color:var(--ui-fg);box-sizing:border-box;}
.specview{max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.65;padding:14px 16px;margin:0;}
@media(max-width:768px){.specview{max-height:300px;font-size:11.5px;}.specta{min-height:200px;}}
ul.dlist li{margin:4px 0;}

/* token preview scope */
.scope{color:var(--fg);font-family:var(--font-family,inherit);}
.ramp{display:flex;align-items:center;gap:12px;margin:7px 0;}
.ramp .lbl{width:78px;flex:none;font-size:12px;font-weight:700;color:var(--ui-fg-strong);}
.ramp .strip{flex:1;display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--ui-border);}
.ramp .step{flex:1;height:50px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:10px;cursor:copy;font-family:"Roboto Mono",monospace;}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin:12px 0;}
.sw{border:1px solid var(--ui-border);border-radius:10px;overflow:hidden;background:var(--ui-panel);}
.sw .chip{height:48px;}.sw .info{padding:7px 9px;font-size:11.5px;}
.sw .info b{display:block;font-weight:600;color:var(--ui-fg-strong);}.sw .info code{font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--ui-fg-lower);cursor:copy;}
.demo{border:1px solid var(--ui-border);border-radius:14px;padding:22px;margin:12px 0;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.demo.col{flex-direction:column;align-items:stretch;}
.demo.on-canvas{background:var(--canvas);}
.type-row{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid var(--ui-border-low);}
.type-row .lbl{width:168px;flex:none;font-size:12px;color:var(--ui-fg-lower);font-family:"Roboto Mono",monospace;}
.type-row .sample{flex:1;min-width:0;color:var(--fg-strong);}
table.dtab{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;background:var(--ui-panel);}
table.dtab th,table.dtab td{border:1px solid var(--ui-border);padding:8px 10px;text-align:left;}
table.dtab th{background:var(--ui-panel-2);font-weight:700;color:var(--ui-fg-strong);}
table.dtab code{font-family:"Roboto Mono",monospace;font-size:12px;background:var(--ui-panel-2);padding:1px 5px;border-radius:3px;}

/* component styles (read scope tokens) */
.btn{font:inherit;font-size:14px;font-weight:var(--btn-weight,600);border-radius:var(--btn-radius,8px);padding:9px var(--btn-padx,16px);cursor:pointer;border:1px solid transparent;transition:.12s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--bg-primary);color:#fff;box-shadow:var(--btn-shadow,none);}.btn-primary:hover{filter:brightness(.94);}
.btn-secondary{background:var(--bg-primary-low);color:var(--fg-primary);}
.btn-outline{background:var(--bg);color:var(--fg-strong);border-color:var(--border-strong);}
.btn-ghost{background:transparent;color:var(--fg-lower);}.btn-ghost:hover{background:var(--bg-neutral-low);}
.btn-danger{background:var(--bg-critical);color:#fff;}
.btn[disabled]{background:var(--bg-disabled);color:var(--fg-disabled);cursor:not-allowed;}
.btn-sm{font-size:12.5px;padding:6px 11px;}.btn-lg{font-size:15px;padding:12px 22px;}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--tag-radius,999px);font-size:12px;font-weight:600;}
.tag .d{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85;}
.field{display:flex;flex-direction:column;gap:6px;min-width:210px;}
.field label{font-size:12.5px;font-weight:600;color:var(--fg-strong);}
.input,.selectbox{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--in-radius,8px);background:var(--bg-inset,var(--bg));color:var(--fg);width:100%;}
.input:focus,.selectbox:focus{outline:2px solid var(--bg-primary);outline-offset:-1px;}
.input::placeholder{color:var(--fg-disabled);}
.statcard{border:1px solid var(--border);border-radius:var(--card-radius,12px);background:var(--panel,var(--bg));padding:16px 18px;box-shadow:var(--shadow-3,0 6px 16px rgba(0,0,0,.05));min-width:200px;flex:1;}
.statcard .k{font-size:12px;color:var(--fg-lower);}
.statcard .v{font-size:25px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em;color:var(--fg-strong);}
.statcard .delta{font-size:12px;font-weight:600;color:var(--fg-success);}
.alert{display:flex;gap:9px;padding:11px 14px;border-radius:var(--radius-md,8px);font-size:13px;width:100%;align-items:flex-start;}
.alert-info{background:var(--tag-bg-info);color:var(--tag-fg-info);}
.alert-success{background:var(--tag-bg-success);color:var(--tag-fg-success);}
.alert-warning{background:var(--tag-bg-warning);color:var(--tag-fg-warning);}
.alert-error{background:var(--tag-bg-error);color:var(--tag-fg-error);}
.note{background:var(--bg-primary-low);border:1px solid color-mix(in srgb,var(--bg-primary) 28%,transparent);padding:11px 14px;font-size:13px;margin:12px 0;color:var(--fg-strong);}
.hgrid{font-size:12.5px;border-collapse:collapse;width:100%;}.hgrid td,.hgrid th{border:1px solid var(--border);padding:7px 10px;}
.hgrid tr.head th{background:#F6F7FA;color:#586A85;}
.hgrid tr.sub td{background:var(--bg-primary-low);font-weight:700;color:var(--fg-strong);}
.hgrid tr.total td{background:#26374D;color:#fff;font-weight:700;}

/* selection controls */
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg-strong);cursor:pointer;}
.chk input{appearance:none;width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:var(--ctl-radius,5px);display:grid;place-items:center;cursor:pointer;background:var(--bg);transition:.12s;}
.chk input[type=radio]{border-radius:50%;}
.chk input:checked{background:var(--bg-primary);border-color:var(--bg-primary);}
.chk input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg) translateY(-1px);}
.chk input[type=radio]:checked::after{content:"";border-radius:50%;background:#fff;width:7px;height:7px;}
.chk input:focus-visible{outline:2px solid var(--bg-primary);outline-offset:2px;}
.switch{position:relative;width:40px;height:23px;flex:none;display:inline-block;}
.switch input{appearance:none;width:100%;height:100%;border-radius:999px;background:var(--border-strong);cursor:pointer;transition:.15s;margin:0;}
.switch input:checked{background:var(--bg-primary);}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked::after{left:19px;}
.segmented{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;}
.segmented button{border:0;background:var(--bg);color:var(--fg-lower);font:inherit;font-size:13px;padding:7px 14px;cursor:pointer;border-right:1px solid var(--border);}
.segmented button:last-child{border-right:0;}.segmented button.on{background:var(--bg-primary);color:#fff;font-weight:600;}

/* states */
.states{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px;}
.states .st{border:1px solid var(--ui-border);border-radius:10px;padding:14px;text-align:center;background:var(--ui-panel);}
.states .st .cap{font-size:11px;color:var(--ui-fg-lower);margin-top:9px;font-family:"Roboto Mono",monospace;}
.spinner{width:20px;height:20px;border:2.5px solid var(--bg-primary-low);border-top-color:var(--bg-primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(12,12,13,.5);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--panel,var(--bg));color:var(--fg);border-radius:14px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .16s ease;}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal .mh{padding:18px 20px 0;font-size:16px;font-weight:700;color:var(--fg-strong);}
.modal .mb{padding:10px 20px 18px;font-size:13.5px;color:var(--fg-lower);}
.modal .mf{padding:14px 20px;background:var(--bg-neutral-lower,var(--bg-neutral));display:flex;justify-content:flex-end;gap:8px;}
.drawer{position:fixed;top:0;right:0;height:100%;width:340px;max-width:88vw;background:var(--panel,var(--bg));color:var(--fg);box-shadow:-8px 0 40px rgba(0,0,0,.3);z-index:85;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--border);font-weight:700;color:var(--fg-strong);display:flex;justify-content:space-between;align-items:center;}
.drawer .db{padding:18px 20px;font-size:13.5px;color:var(--fg-lower);flex:1;}
.tooltip{position:relative;display:inline-block;}
.tooltip .tip{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:var(--bg-contrast);color:var(--fg-contrast);font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s;}
.tooltip:hover .tip{opacity:1;transform:translateX(-50%) translateY(-2px);}
.dropdown{position:relative;display:inline-block;}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:170px;background:var(--panel,var(--bg));border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;display:none;z-index:30;}
.menu.open{display:block;}
.menu a{display:block;padding:8px 11px;border-radius:7px;font-size:13.5px;color:var(--fg-strong);cursor:pointer;}
.menu a:hover{background:var(--bg-neutral-low);}.menu .sep{height:1px;background:var(--border-low);margin:5px 4px;}

/* navigation */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);}
.tabbar button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--fg-lower);padding:10px 15px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabbar button.on{color:var(--fg-primary);border-bottom-color:var(--bg-primary);}
.tabpanel{padding:16px 2px;font-size:13.5px;color:var(--fg-lower);}
.pager{display:inline-flex;gap:4px;}
.pager button{min-width:34px;height:34px;border:1px solid var(--border);background:var(--bg);color:var(--fg-strong);border-radius:8px;font:inherit;font-size:13px;cursor:pointer;}
.pager button.on{background:var(--bg-primary);color:#fff;border-color:transparent;font-weight:700;}
.pager button:disabled{color:var(--fg-disabled);cursor:not-allowed;}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-lower);}
.crumbs .cur{color:var(--fg-strong);font-weight:600;}.crumbs .sl{color:var(--fg-disabled);}
.steps{display:flex;align-items:center;width:100%;}
.steps .stp{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--fg-lower);}
.steps .stp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg-neutral);color:var(--fg-lower);border:1px solid var(--border);}
.steps .stp.done .n{background:var(--bg-primary);color:#fff;border-color:transparent;}
.steps .stp.cur .n{background:var(--bg-primary-low);color:var(--fg-primary);border-color:var(--bg-primary);}
.steps .line{flex:1;height:1px;background:var(--border);margin:0 12px;}

/* feedback */
.prog{height:8px;border-radius:999px;background:var(--bg-neutral);overflow:hidden;width:100%;max-width:340px;}
.prog i{display:block;height:100%;background:var(--bg-primary);border-radius:999px;}
.skel{background:linear-gradient(90deg,var(--bg-neutral) 25%,var(--bg-neutral-low) 37%,var(--bg-neutral) 63%);background-size:400% 100%;animation:shimmer 1.3s infinite;border-radius:6px;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.empty{text-align:center;padding:30px 20px;color:var(--fg-lower);width:100%;}
.empty .ic{font-size:34px;opacity:.4;}.empty .t{font-weight:700;color:var(--fg-strong);margin:8px 0 4px;font-size:14px;}
.countbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bg-critical);color:#fff;font-size:11px;font-weight:700;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--bg-primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;}

/* layout / motion / a11y */
.bpgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:10px 0;}
.bpgrid i{background:var(--bg-primary-low);border:1px solid var(--border-primary);border-radius:5px;height:34px;display:grid;place-items:center;font-size:10px;color:var(--fg-primary);font-family:"Roboto Mono",monospace;}
.motionbox{width:70px;height:44px;border-radius:8px;background:var(--bg-primary);cursor:pointer;}
.motionbox.d1{transition:transform .15s ease;}.motionbox.d2{transition:transform .25s ease;}.motionbox.d3{transition:transform .4s cubic-bezier(.2,.8,.2,1);}
.demo:hover .motionbox{transform:translateX(30px);}

/* export */
.export{position:relative;padding:16px;font-family:"Roboto Mono",monospace;font-size:12px;line-height:1.6;overflow:auto;max-height:360px;margin:10px 0;white-space:pre;}
.copy{position:absolute;top:10px;right:10px;font:inherit;cursor:pointer;}
.copy:hover{filter:brightness(1.1);}
.tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tabs button{font:inherit;cursor:pointer;}
/* ---- extended components (per-system shapes via tokens) ---- */
.chipset{display:flex;flex-wrap:wrap;gap:8px;}
.fchip{border:1px solid var(--border-strong);background:var(--bg);color:var(--fg-lower);font:inherit;font-size:13px;font-weight:var(--btn-weight,600);padding:6px 13px;border-radius:var(--tag-radius,999px);cursor:pointer;transition:.12s;}
.fchip.on{background:var(--bg-primary);color:#fff;border-color:transparent;}
.fchip:hover:not(.on){border-color:var(--bg-primary);color:var(--fg-strong);}
.range{-webkit-appearance:none;appearance:none;width:100%;max-width:300px;height:6px;border-radius:999px;background:var(--bg-neutral);outline:none;}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--bg-primary);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.range::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--bg-primary);cursor:pointer;}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--bg-primary) calc(var(--v,66)*1%),var(--bg-neutral) 0);}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--panel,var(--bg));display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--fg-strong);}
.acc{border:1px solid var(--border);border-radius:var(--card-radius,10px);overflow:hidden;width:100%;max-width:460px;}
.acc details{border-bottom:1px solid var(--border-low);}.acc details:last-child{border-bottom:0;}
.acc summary{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--fg-strong);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary::after{content:"+";color:var(--fg-lower);font-size:16px;}
.acc details[open] summary::after{content:"\2212";}

/* ---- 시작 화면 ---- */
.lead{ font-size:var(--t-lead); }

.c.main .n{ color:var(--paper); font-size:var(--t-sub); font-weight:300; }

.c.main .d b{ font-weight:400; color:var(--paper); }

.st{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }

}

/* ---- 사용설명서 ---- */
.file,.qa,.case{ padding:var(--card-pad); }
.fd,.q,.a{ font-size:var(--t-small); line-height:var(--lh-small); }

/* ---- 조립기 ---- */
.swatchpick,.ramp,.rl{ border-radius:var(--r-flat); }
.seg{
  border-radius:var(--r-pill);
  padding:3px;
  background:transparent;
  border:var(--hair) solid var(--ui-border);

/* ---- 생성기 ---- */
.lbl{
  font-size:var(--t-caption);

/* ---- 모음집 ---- */
.composer{ padding:var(--card-pad); border:var(--hair) solid var(--ui-border); }

   카드는 button 이 아니라 div 라 role 과 tabindex 로 닿게 해 뒀다. */
:focus-visible{

/* 규칙 추가 버튼과 주의 상자 제목 */

<script>
/* 한 파일로 합치면서 붙는 다리. 화면 이동·테마·쿼리를 부모와 주고받는다. */
(function(){
  var r=document.documentElement;
  window.dskQuery=function(){ try{ return '?'+parent.dsk.q(); }catch(e){ return ''; } };
  // 모음집은 data-theme 으로, 나머지 화면은 data-ui 로 테마를 잡는다.
  // 화면마다 이름이 달라 그대로 두면 모음집만 따로 논다. 쓰는 이름에 맞춰 옮긴다.
  var ATTR = r.hasAttribute('data-theme') ? 'data-theme' : 'data-ui';
  try{ var t=localStorage.getItem('dsk_ui'); if(t) r.setAttribute(ATTR,t); }catch(e){}
  try{
    new MutationObserver(function(){
      try{ localStorage.setItem('dsk_ui', r.getAttribute(ATTR)||'light'); }catch(e){}
    }).observe(r,{attributes:true,attributeFilter:['data-ui','data-theme']});
  }catch(e){}
  var MAP={'index.html':'index','library.html':'library','builder.html':'builder',
           'generator.html':'generator','guide.html':'guide'};
  document.addEventListener('click',function(e){
    var el=e.target; if(!el||!el.closest) el=el.parentElement;

    var h=a.getAttribute('href')||''; if(!h||h.charAt(0)==='#') return;

})();

# monopo saigon — Style Reference
> Liquid iridescence behind editorial silence — a monochrome editorial gallery floating on molten light.

**Theme:** light

Source measurements are normalized; roles and recommendations are interpreted. Font summary lists are independent, not paired by position. HTML examples are reconstructions, not source components.

Monopo Saigon runs on radical monochrome discipline: pure black and white with whisper-thin grays, wrapped around massive Roobert typography that breathes across full-bleed canvases. The signature contrast lives between austere editorial restraint (sharp 0px corners on navigation and text links, generous whitespace, 4px-based rhythm) and a single expressive gesture — full-pill 75px-radius buttons that float like liquid over imagery. Hero environments lean into iridescent, fluid, chromatic atmospheres (greens dissolving into amber into deep oxblood) while the interface itself never picks up a hue, creating the feeling of a black-and-white editorial gallery floating on a river of liquid light. Type sets the temperature: weight 300 at 78px whispers, weight 400 at 225px fills the viewport, and weight 400 at 11px labels everything else with confident minimalism. Motion is expressive but patient — cubic-bezier(0.19, 1, 0.22, 1) ease curves stretching up to 1.25s transform transitions, letting elements glide rather than snap.

## Tokens — Colors

| Name | Value | Token | Role |
|------|-------|-------|------|
| Obsidian | `#000000` | `--color-obsidian` | Primary text, SVG strokes, overlay fills — pure black carries all foreground information and graphic marks |
| Paper | `#ffffff` | `--color-paper` | Light text on dark surfaces, inverse labels, and high-contrast captions. Do not promote it to the primary CTA color |
| Inkstone | `#181818` | `--color-inkstone` | Footer body copy and secondary headings — softened black for long-form reading blocks |
| Felt Gray | `#6d6d6d` | `--color-felt-gray` | Muted helper text, address blocks, legal copy — quiet annotations that recede without disappearing |
| Slate Pill | `#636363` | `--color-slate-pill` | Filled neutral button background — the only solid fill used for actions like Accept |
| Ash Mist | `#9a9a9a` | `--color-ash-mist` | Mid-tone neutral for disabled or low-contrast surfaces in the surface stack |
| Pewter | `#808080` | `--color-pewter` | Secondary mid-tone neutral for hover or muted state layers |
| Iridescent Fade | `linear-gradient(90deg, rgb(160, 224, 171), rgb(255, 172, 46) 50%, rgb(165, 45, 37))` | `--color-iridescent-fade` | Chromatic accent appearing only inside the hero gradient wash — molten oxblood anchor of the iridescent atmosphere, not used in interface controls |

## Tokens — Typography

### Roobert — Primary typeface across all interface text, navigation, hero headlines, body, lists, and footers. The custom sans carries geometric clarity with humanist warmth; its wide weight range (300 whisper through 600 anchor) lets the system breathe from monumental 225px headlines down to 11px labels · `--font-roobert`
- **Substitute:** Inter or Söhne — both share Roobert's geometric-humanist balance and clean aperture
- **Weights:** 300, 400, 600
- **Sizes:** 11px, 12px, 16px, 18px, 29px, 30px, 39px, 45px, 54px, 78px, 94px, 225px
- **Line height:** 0.70–2.34 (tight 0.70–0.76 on display sizes, generous 1.58 on body)
- **Role:** Primary typeface across all interface text, navigation, hero headlines, body, lists, and footers. The custom sans carries geometric clarity with humanist warmth; its wide weight range (300 whisper through 600 anchor) lets the system breathe from monumental 225px headlines down to 11px labels

### Raleway — Reserved for specific heading contexts where a slightly more elegant, narrower sans introduces contrast — appears sparingly as a counterpoint to Roobert's bolder presence · `--font-raleway`
- **Substitute:** Montserrat or Jost
- **Weights:** 400
- **Sizes:** 54px
- **Line height:** 1.39
- **Role:** Reserved for specific heading contexts where a slightly more elegant, narrower sans introduces contrast — appears sparingly as a counterpoint to Roobert's bolder presence

### system-ui — Micro UI labels, cookie banner body, fine print — browser default fallback ensuring legibility at the smallest scale without committing to a custom face · `--font-system-ui`
- **Weights:** 400
- **Sizes:** 9px, 16px
- **Line height:** 1.15–1.32
- **Role:** Micro UI labels, cookie banner body, fine print — browser default fallback ensuring legibility at the smallest scale without committing to a custom face

## Components

### Ghost Pill Button (Dark Surface)
**Role:** Primary action button used over iridescent or dark hero media

Transparent background, 1px solid rgba(255,255,255,0.3) border, #ffffff text, 75px border-radius (full pill), 11px vertical and 33px horizontal padding, Roobert 16px weight 400. The translucent border dissolves into the iridescent background while the pill silhouette stays unmistakable.

### Ghost Pill Button (Light Surface)
**Role:** Secondary action on white or light gray sections

Transparent background, 1px solid #000000 border, #000000 text, 75px border-radius, 11px vertical and 33px horizontal padding, Roobert 16px weight 400. Mirrors the dark-surface variant — same geometry, inverted palette.

### Filled Neutral Pill
**Role:** Cookie consent and utilitarian confirmations

rgba(55,55,55,0.78) background (functionally Slate Pill #636363), #ffffff text, 1px solid #ffffff border, 75px border-radius, 11px vertical and 33px horizontal padding. The only solid-filled action in the system — used sparingly for compliance and consent, never for primary marketing CTAs.

### Underline-Free Text Link
**Role:** Inline navigation, menu items, language switcher, footer links

No background, no border, 0px radius. Roobert 12–16px weight 400, color shifts between #ffffff (on dark) and #000000 (on light). Underlines are absent — context and weight set the link apart from body copy. Generous line-height (1.36 at 11px, 1.19 at 12px) keeps stacked menus airy.

### Hero Display Headline
**Role:** Full-viewport editorial title

Roobert 225px weight 400, line-height 1.25, #ffffff over iridescent dark media. Letter-spacing normal. The headline is the hero — no subhead, no CTA, just one monumental phrase centered in the viewport breathing against fluid light.

### Section Heading (Whisper Weight)
**Role:** Atmospheric headline for manifesto or feature sections

Roobert 78px weight 300, line-height 1.10. The 300-weight at this scale is anti-convention — most sites push 600–700 here. The whisper weight lets the headline feel like it is being spoken, not shouted, giving the editorial chamber its hushed authority.

### Section Heading (Anchor Weight)
**Role:** Bold editorial divider or statement

Roobert 94px weight 400, line-height 0.76. The tight line-height (0.76) is dramatic — text lines almost touch, creating a dense typographic block that reads as art object. Used for large statement moments where the text itself is visual.

### Project Card / List Row
**Role:** Featured work entry — paired image and title

Transparent background, 0px border-radius, no shadow. Image bleeds full-width within the 1078px container; title sits below in Roobert 16–18px weight 400. No card chrome — the card is content, not a container. Spacing between rows controlled by 14–46px gaps depending on section density.

### Language Switcher
**Role:** Top-bar locale selector (EN / VN / 中文)

Three inline text links in Roobert 12px weight 400, color #ffffff or #000000 depending on surface, 0px radius, separated by visual whitespace rather than dividers. Active locale carries the same color but slightly heavier visual weight through spacing alone.

### Rotating Scroll Indicator
**Role:** Bottom-left circular badge prompting downward exploration

Circular SVG badge with text tracing the circumference ('SCROLL DOWN · SCROLL DOWN'), rotating continuously at slow tempo. Sits at 0,0 of the bottom-left corner with small offset. Ink black stroke on transparent fill — a typographic punctuation mark, not a button.

### Footer Address Block
**Role:** Studio contact information

Roobert 11px weight 400 line-height 1.36, #6d6d6d Felt Gray text. Tight 8px top margins between lines create a compact address stack that recedes into the page. No dividers or labels — the muted gray does the work.

### Cookie Banner
**Role:** Compliance notice with single accept action

Fixed bottom bar, rgba(55,55,55,0.78) Slate Pill background, white body text in system-ui 9–16px, paired with Filled Neutral Pill 'Accept' button. Minimal copy, single action, no settings — the banner respects attention by asking for nothing beyond consent.

### Top Navigation Bar
**Role:** Persistent header with logo, locale, and menu

Fixed transparent header 66px tall. Logo wordmark top-left (Roobert 16px weight 400 'monopo saigon'), language switcher centered, menu stack right-aligned (WORK / MANIFESTO / SAIGON SOULS / TEAM / CONTACT at 11–12px weight 400). No background fill — the header is invisible until content scrolls behind it.

### Iridescent Hero Backdrop
**Role:** Atmospheric media behind hero headlines

Full-viewport organic gradient or video: soft sage green (rgb 160,224,171) dissolving through molten amber (rgb 255,172,46) into deep oxblood (rgb 165,45,37). Applied as a flowing, liquid texture — never as a flat gradient. This is the only chromatic surface in the entire system and exists only behind text, never as UI fill.

## Do's and Don'ts

### Do
- Set display headlines at 225px Roobert weight 400 and let them own the viewport — never crowd them with subheads or CTAs
- Use the 75px pill radius exclusively for buttons and tags — keep all other elements (cards, images, inputs) at 0px radius for sharp editorial contrast
- Reserve color for one iridescent hero backdrop per page — keep all interface text, borders, and fills strictly in the black/white/gray scale
- Use weight 300 at 78px for manifesto and atmospheric headlines to create whisper authority — never push above weight 400 at this scale
- Set line-height to 0.70–0.76 on display sizes above 78px to let lines lock together as typographic art objects
- Apply cubic-bezier(0.19, 1, 0.22, 1) easing to transform and color transitions with durations of 0.8–1.25s for patient, gliding motion
- Keep all interactive text links at 0px radius with no underlines — let spacing, color, and context signal affordance

### Don't
- Never introduce a chromatic UI color — black, white, and gray are the interface palette; the iridescent gradient is media only
- Never use box-shadow or elevation on cards, buttons, or images — the system relies on flat surfaces and hairline 1px borders
- Never set border-radius between 1px and 74px — the system jumps from sharp 0px to full 75px pill, no intermediate rounding
- Never use bold or heavy weights (600+) above 45px — large sizes should whisper at 300 or speak at 400, never shout
- Never center-align body copy in address blocks, lists, or project descriptions — left-align with 8–14px line gaps for editorial flow
- Never add gradients to buttons, badges, or UI controls — gradients belong only in the hero atmospheric media
- Never use Raleway for body or navigation — it is a heading accent only, and even there it appears sparingly
- Never fill the canvas with imagery — the system is text-dominant with one hero-sized visual gesture per page

## Surfaces

| Level | Name | Value | Purpose |
|-------|------|-------|---------|
| 1 | Paper | `#ffffff` | Primary canvas — most sections sit on pure white |
| 2 | Slate Pill | `#636363` | Filled button surface for cookie consent and neutral actions |
| 3 | Obsidian | `#000000` | Dark overlay and inverse section — full-bleed dark bands behind iridescent media |
| 4 | Ash Mist | `#9a9a9a` | Quiet mid-tone layer for inset panels or disabled zones |

## Elevation

The system deliberately avoids shadow elevation. Surfaces are distinguished by color inversion (white to black bands) and hairline 1px borders rather than stacked shadows. The lone 'elevation' gesture is the translucent slate pill on the cookie banner, which uses background opacity rather than shadow to separate from content.

## Imagery

Imagery is theatrical and singular: one massive iridescent fluid texture dominates the hero — organic greens dissolving through amber into oxblood like oil on water or molten glass. It reads as full-bleed atmospheric media, possibly video or shader-driven canvas, and occupies the entire viewport as a singular sensory moment rather than a repeated pattern. Project showcases use contained editorial photography (tight product crops, campaign stills) presented without frames or borders — the image is the content. No illustration, no icons beyond tiny UI glyphs, no decorative shapes. Iconography is minimal or absent; the rotating circular text badge functions as the system's only typographic ornament. Overall density: text-dominant with one hero-sized visual gesture, then long quiet editorial stretches of typography and product imagery.

## Layout

Layout is max-width contained at 1078px, centered, with full-bleed dark hero sections breaking the container. The hero is full-viewport: centered monumental headline (Un i ted, Unbound) floating over iridescent media, minimal navigation floating at top, single rotating badge at bottom-left. Body sections follow a spacious editorial rhythm — generous 46px section gaps create breathing room between blocks, alternating between white and dark (black with white type) bands. Content arrangement is asymmetric: text-left/image-right and image-left/text-right alternations dominate, with no centered stacks outside the hero. Card grids appear as single-column project lists rather than multi-column grids — each project gets the full width with its image and title. Navigation is a transparent top bar with logo left, locale center, menu right — no sticky color shift, no shadow, just invisible persistence. The footer is a compact three-column address block (Tokyo, Saigon, London) with quiet 11px copy. Overall: editorial magazine pacing in a digital frame.

## Agent Prompt Guide

**Quick Color Reference**
- text primary: #000000
- text muted: #6d6d6d
- background: #ffffff
- dark overlay / inverse section: #000000
- border (light surface): #000000
- border (dark surface): rgba(255,255,255,0.3)
- accent: none — the only chromatic color is the iridescent hero gradient, which is media only
- primary action: no distinct CTA color

**3 Example Component Prompts**
No distinct primary action color was observed; use the extracted neutral button treatments instead of inventing a filled CTA color.

2. Build a project list row: transparent background, 0px radius, no shadow. Full-bleed image at the top within the 1078px container, sharp corners. Project title below in Roobert 16px weight 400, color #000000. 46px gap to the next row. No card chrome, no borders, no padding around the content itself.

3. Build a Ghost Pill Button on a light surface: transparent background, 1px solid #000000 border, 75px border-radius, 11px padding-top and padding-bottom, 33px padding-left and padding-right. Label in Roobert 16px weight 400, color #000000. No hover fill — animate border opacity and letter-spacing on transition with cubic-bezier(0.19, 1, 0.22, 1) over 0.8s.

## Motion Personality

Motion is expressive but unhurried — the system treats transitions as slow camera moves rather than UI snaps. The signature curve is cubic-bezier(0.19, 1, 0.22, 1) (a gentle ease-out) applied to transform, color, and opacity at 0.8s and 1.25s durations. Shorter easing uses plain 'ease' at 0.4s for color and opacity micro-transitions. A rotating animation runs continuously on the scroll-indicator badge at slow tempo. Transforms dominate over positional animation — elements glide, slide, and reveal through transform rather than repositioning layout. The 1.25s duration on transforms (69 occurrences) signals that the studio prefers patience over responsiveness; nothing should feel abrupt. Border transitions (6 occurrences) and flex-basis shifts are rare and reserved for layout reveals, not micro-interactions.

## Similar Brands

- **Resn** — Same liquid iridescent hero treatment behind monochrome editorial typography and full-pill ghost buttons
- **Active Theory** — Same immersive full-bleed dark hero with single monumental headline and restrained monochrome chrome around it
- **Locomotive** — Same editorial agency rhythm — oversized whisper-weight headlines, generous 46px+ section gaps, and zero shadow elevation
- **Pentagram** — Same austere black-and-white editorial system with sharp 0px corners and custom geometric sans (Roobert echoing Pentagram's house faces)

// 책임님이 붙여넣은 스펙 원문을 한 글자도 고치지 않고 보관하고 그대로 내보낸다.
// 토큰으로 재해석한 값과 원문을 둘 다 남겨야 원본 표현이 사라지지 않는다.
const SPECS={},SPECTITLE={};
document.querySelectorAll('script.rawspec').forEach(function(el){
  SPECS[el.dataset.sys]=el.textContent.replace(/^\n/,'').replace(/\s+$/,'');
  SPECTITLE[el.dataset.sys]=el.dataset.title||'';
});
const SPECKEY=function(id){return 'dsk_spec_'+id;};
function userSpec(id){ try{return localStorage.getItem(SPECKEY(id))||'';}catch(e){return '';} }
function builtinSpec(id){ return SPECS[id]||''; }
function getSpec(id){ return userSpec(id)||builtinSpec(id); }
function hasSpec(id){ return !!getSpec(id); }
function saveSpec(id,txt){
  try{ txt=(txt||'').replace(/\s+$/,'');
    if(txt) localStorage.setItem(SPECKEY(id),txt); else localStorage.removeItem(SPECKEY(id));
    return true; }catch(e){ return false; }
}
function specTitle(id){
  var sys=SYSTEMS.find(function(x){return x.id===id;});
  return userSpec(id) ? ((sys?sys.name:id)+' 내 스펙') : (SPECTITLE[id]||((sys?sys.name:id)+' 원문 스펙'));
}
function specBlock(id){
  var t=getSpec(id); if(!t) return '';
  return '# '+specTitle(id)+'\n\n'
    +'> 아래는 이 시스템의 원문 스펙입니다. 요약하거나 바꾸지 말고 이 내용을 근거로 작업하세요.\n\n'
    +t;
}

function copyText(t){
  // 표준 방법이 막히면 숨긴 칸을 거쳐 복사한다
  return new Promise(function(done,fail){
    try{
      if(navigator.clipboard && window.isSecureContext!==false){
        navigator.clipboard.writeText(t).then(function(){done(1);},function(){ legacy(); });
        return;
      }
    }catch(e){}
    legacy();
    function legacy(){
      try{
        var ta=document.createElement('textarea');
        ta.value=t; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
        var okd=document.execCommand('copy');
        ta.remove();
        okd?done(1):fail(0);
      }catch(e){ fail(0); }
    }
  });
}

// full flattened tokens for a system+theme (ramps are theme-independent)
function allTokens(sys){
  const t=theme();const out={};
  const rampMap={primary:sys.ramps.primary,gray:sys.ramps.gray,success:sys.ramps.success,warning:sys.ramps.warning,error:sys.ramps.error,info:sys.ramps.info};
  for(const name in rampMap) rampMap[name].forEach(([s,hex])=>out[`--${name}-${s}`]=hex);
  Object.assign(out, t==='dark'?sys.semDark:sys.semLight);
  Object.assign(out, tagTokens(t), graphTokens(t));
  for(const k in sys.radius) out[`--radius-${k}`]=sys.radius[k];
  SPACE.forEach(([s,v])=>out[`--space-${s}`]=v);
  out["--font-family"]=FONT[sys.id]||`"Pretendard",system-ui,sans-serif`;
  const u=UI[sys.id]||{};
  out["--btn-radius"]=u.btnR||out["--radius-md"]||"8px";
  out["--btn-weight"]=u.btnW||"600";
  out["--btn-shadow"]=u.btnSh||"none";
  out["--ctl-radius"]=u.ctlR||"5px";
  out["--card-radius"]=u.cardR||out["--radius-lg"]||"12px";
  out["--btn-padx"]=u.padx||"16px";
  out["--in-radius"]=u.inR||out["--radius-md"]||"8px";
  out["--tag-radius"]=TAGR[sys.id]||"999px";
  return out;
}

// contrast
function lum(hex){const c=hex.replace('#','');const n=parseInt(c.length===3?c.split('').map(x=>x+x).join(''):c,16);
  const r=(n>>16&255)/255,gg=(n>>8&255)/255,b=(n&255)/255;const f=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);
  return .2126*f(r)+.7152*f(gg)+.0722*f(b);}
function ratio(a,b){const L1=lum(a),L2=lum(b);return ((Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05));}

function peekHTML(kind, idx){
  if(kind==='layout'){
    const L=LAYOUTS[idx]; if(!L) return '';
    return '<div class="hw">'+L[2]+'</div><div class="hn">'+L[0]+'</div><div class="hd">'+L[1]+'</div>';
  }
  if(kind==='page'){
    const P=PAGES[idx]; if(!P) return '';
    const nImg=P.sections.filter(function(x){return imgSpec(x[0]);}).length;
    const wire=P.sections.slice(0,6).map(function(_,j){
      return '<div class="'+(j===0?'wa':'wb')+'" style="height:'+(j===0?26:12)+'px"></div>';}).join('');
    return '<div class="hw">'+wire+'</div><div class="hn">'+P.name+'</div><div class="hd">'+P.note+'</div>'
      +'<div class="hs"><span>섹션 '+P.sections.length+'개</span><span>이미지 '+nImg+'곳</span><span>'+P.cat+'</span></div>';
  }
  if(kind==='sys'){
    const S=SYSTEMS.find(function(x){return x.id===idx;}); if(!S) return '';
    const sw=S.cover.map(function(c){return '<div style="flex:1;background:'+c+'"></div>';}).join('');
    const R=S.radius||{};
    return '<div class="hw" style="padding:0;flex-direction:row;gap:0">'+sw+'</div>'
      +'<div class="hn" style="font-family:'+(FONT[S.id]||'inherit').replace(/"/g,"\'")+'">'+S.name+'</div>'
      +'<div class="hd">'+S.desc+'</div>'
      +'<div class="hs"><span>'+S.cat+'</span><span>'+(S.font.split(/[·,]/)[0].replace(/"/g,'').trim())+'</span><span>모서리 '+(R.md||'8px')+'</span></div>';
  }
  return '';
}
let _peekEl=null;
function peekShow(html,x,y){
  if(!_peekEl) _peekEl=document.getElementById('hoverPeek');
  if(!_peekEl||!html) return;
  _peekEl.innerHTML=html; _peekEl.classList.add('on');
  const w=280, h=_peekEl.offsetHeight||300;
  let left=x+20, top=y-30;
  if(left+w>window.innerWidth-12) left=Math.max(12,x-w-20);
  if(top+h>window.innerHeight-12) top=window.innerHeight-h-12;
  if(top<12) top=12;
  _peekEl.style.left=left+'px'; _peekEl.style.top=top+'px';
}
function peekHide(){ if(!_peekEl) _peekEl=document.getElementById('hoverPeek'); if(_peekEl) _peekEl.classList.remove('on'); }

function makeSelect(wrapId, selId, kind){
  const wrap=document.getElementById(wrapId), sel=document.getElementById(selId);
  if(!wrap||!sel) return;
  wrap.querySelectorAll('.cbtn,.copts').forEach(function(n){n.remove();});
  const opts=Array.prototype.slice.call(sel.options);
  const btn=document.createElement('button');
  btn.type='button'; btn.className='cbtn';
  btn.innerHTML='<span class="cv"></span><span class="cc">▾</span>';
  const list=document.createElement('div'); list.className='copts';
  opts.forEach(function(o,i){
    const d=document.createElement('div');
    d.className='copt'+(o.selected?' sel':''); d.textContent=o.textContent; d.dataset.v=o.value; d.dataset.i=i;
    list.appendChild(d);
  });
  wrap.appendChild(btn); wrap.appendChild(list);
  function label(){ btn.querySelector('.cv').textContent = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : ''; }
  function idxOf(v){ return kind==='sys' ? v : (v===''? null : +v); }
  function close(){ list.classList.remove('open'); peekHide(); }
  label();
  btn.onclick=function(e){
    e.stopPropagation();
    document.querySelectorAll('.copts.open').forEach(function(n){ if(n!==list) n.classList.remove('open'); });
    list.classList.toggle('open');
    if(!list.classList.contains('open')) peekHide();
  };
  list.addEventListener('mousemove',function(e){
    const d=e.target.closest('.copt'); if(!d) return;
    const idx=idxOf(d.dataset.v);
    if(idx===null){ peekHide(); return; }
    const r=list.getBoundingClientRect();
    peekShow(peekHTML(kind, idx), r.right, e.clientY);
  });
  list.addEventListener('mouseleave',peekHide);
  list.addEventListener('click',function(e){
    const d=e.target.closest('.copt'); if(!d) return;
    sel.value=d.dataset.v;
    list.querySelectorAll('.copt').forEach(function(n){ n.classList.toggle('sel', n===d); });
    label(); close();
    sel.dispatchEvent(new Event('change',{bubbles:true}));
  });
  btn.addEventListener('mousemove',function(e){
    if(list.classList.contains('open')) return;
    const idx=idxOf(sel.value); if(idx===null){ peekHide(); return; }
    peekShow(peekHTML(kind, idx), e.clientX, e.clientY);
  });
  btn.addEventListener('mouseleave',function(){ if(!list.classList.contains('open')) peekHide(); });
  wrap._close=close;
}

function renderContrast(T){
  const pairs=[["본문/배경","--fg","--bg",4.5],["보조텍스트/배경","--fg-lower","--bg",4.5],["흰글씨/Primary","--fg-contrast","--bg-primary",4.5],["Primary글씨/Primary-low","--fg-primary","--bg-primary-low",4.5]];
  const rows=pairs.map(([lbl,a,b,min])=>{const A=T[a],B=T[b];if(!A||!B)return'';const r=ratio(A,B);const ok=r>=min;
    return `<tr><td>${lbl}</td><td><code>${A}</code> / <code>${B}</code></td><td>${r.toFixed(2)}:1</td><td class="${ok?'a11y-ok':'a11y-no'}">${ok?'AA 통과':'미달'}</td></tr>`;}).join('');

}

/* ===================== EXPORT BUILDERS ===================== */
function aiPrompt(sys){
  const T=allTokens(sys);
  return `# ${sys.name} 디자인 시스템 스펙 (AI 코딩용)\n`
      +`아래 토큰만 사용해 UI를 만들어줘. 임의 색/폰트 금지. 라이트/다크 양쪽 지원.\n`
      +`프레임워크: ${sys.framework} · 폰트: ${sys.font}, line-height 150%\n\n`
      +`## 색 램프 (50-950, 테마 공통)\n`
      +['primary','gray','success','warning','error','info'].map(n=>`- ${n}: `+sys.ramps[n].map(([s,h])=>`${s}=${h}`).join(', ')).join('\n')
      +`\n\n## 시맨틱 (현재 ${theme()} 테마)\n`
      +['--bg-primary','--bg-primary-low','--fg','--fg-lower','--border','--bg-success','--bg-warning','--bg-critical','--bg-info'].map(k=>`- ${k}: ${T[k]}`).join('\n')
      +`\n\n## 반경 / 간격\n- radius: ${Object.entries(sys.radius).map(([k,v])=>k+'='+v).join(', ')}, pill=999px\n- spacing(4pt): ${SPACE.map(([s,v])=>v).join(', ')}\n\n`
      +`## 컴포넌트 규칙\n- 버튼: primary/secondary/outline/ghost/danger + sm/md/lg + hover/focus-visible/active/disabled/loading\n`
      +`- 태그: 상태 5종${sys.hasTags?' + 카테고리 12색':''}, 배경/글자 짝 사용\n`
      +`- 오버레이: 모달(role=dialog,aria-modal,Esc닫기)·드로어·토스트(aria-live)·툴팁·드롭다운\n`
      +`- 내비: 탭(role=tablist)·스텝·페이지네이션·브레드크럼\n`
      +`- 피드백: progress·spinner·skeleton·empty-state\n`
      +`- 표: 헤더(#F6F7FA/#586A85), 상세, 소계(primary-low), 합계(#26374D 흰글씨)\n`
      +`\n## 태그 색 (배경/글자 짝)\n`
      +['success','warning','error','info','neutral'].map(k=>`- ${k}: ${T['--tag-bg-'+k]} / ${T['--tag-fg-'+k]}`).join('\n')
      +(sys.hasTags?`\n- 카테고리 12색: `+TAG12.map(k=>`${k}(${T['--tag-bg-'+k]}/${T['--tag-fg-'+k]})`).join(', '):'')
      +`\n\n## 차트 색 (순서대로)\n- `+[1,2,3,4,5,6,7,8].map(i=>T['--graph-chart-'+i]).filter(Boolean).join(', ')
      +`\n\n## 그림자\n`+[1,2,3,4,5,6].map(i=>`- shadow-${i}: ${T['--shadow-'+i]}`).filter(x=>!x.includes('undefined')).join('\n')
      +`\n\n## 컴포넌트 모양\n- 버튼 반경 ${T['--btn-radius']} / 카드 ${T['--card-radius']} / 입력 ${T['--in-radius']} / 태그 ${T['--tag-radius']}\n`
      +`- 버튼 글자 굵기 ${T['--btn-weight']}, 좌우 패딩 ${T['--btn-padx']}\n`
      +`- 접근성: focus-visible 2px 링, 대비 AA(본문 4.5:1), prefers-reduced-motion 대응\n`
      +`- 반응형: xl(1280) 데스크톱 기준, 12컬럼 그리드, container 1200px`
      +(sys.extra.type==='grid'?`\n- 고밀도 그리드: 본문 11px, 헤더행 26px·상세행 30px, 세로 채움 준수`:'');
}
function renderExport(sys){
  const T=allTokens(sys);const body=$('#exportBody');
  if(exportFmt==='spec'){
    body.textContent=getSpec(sys.id)||'(원문 스펙이 없습니다. 아래 “원문 스펙” 칸에 붙여넣으세요.)';
  }else if(exportFmt==='css'){
    body.textContent=`:root{\n`+Object.entries(T).map(([k,v])=>`  ${k}: ${v};`).join('\n')+`\n}`;
  }else if(exportFmt==='tw'){
    const c=(k)=>T[k]||'';
    body.textContent=`// tailwind.config.js\nexport default {\n  theme:{ extend:{\n    colors:{\n`
      +`      primary:{50:"${c('--primary-50')}",100:"${c('--primary-100')}",500:"${c('--primary-500')}",600:"${c('--primary-600')}",700:"${c('--primary-700')}",DEFAULT:"${c('--bg-primary')}"},\n`
      +`      gray:{50:"${c('--gray-50')}",100:"${c('--gray-100')}",200:"${c('--gray-200')}",500:"${c('--gray-500')}",700:"${c('--gray-700')}",900:"${c('--gray-900')}"},\n`
      +`      success:"${c('--bg-success')}", warning:"${c('--bg-warning')}", critical:"${c('--bg-critical')}", info:"${c('--bg-info')}",\n`
      +`      fg:"${c('--fg')}","fg-lower":"${c('--fg-lower')}", border:"${c('--border')}",\n    },\n`
      +`    borderRadius:{ sm:"${c('--radius-sm')}", md:"${c('--radius-md')}", lg:"${c('--radius-lg')}", pill:"999px" },\n`
      +`    fontFamily:{ sans:["${sys.font}","system-ui","sans-serif"] },\n  }}\n}`;
  }else if(exportFmt==='json'){
    body.textContent=JSON.stringify({name:sys.name,theme:theme(),font:sys.font,tokens:T},null,2);
  }else if(exportFmt==='react'){
    body.textContent=
`// ${sys.name} 하이브리드 컴포넌트 (Flat + Compound · 공통 primitive)
// 토스 TDS 철학: 쉬운 건 Flat, 커스텀은 Compound, 내부는 같은 primitive 한 벌만 관리.
import React from "react";

/* ── 1) Primitive 레이어 : 내부 공용(한 벌만 관리, CSS 변수 사용) ── */
export const CardRoot = (p) => (
  <section {...p} style={{background:"var(--panel,#fff)",border:"1px solid var(--border)",
    borderRadius:"var(--card-radius,12px)",boxShadow:"var(--shadow-3)",overflow:"hidden",
    fontFamily:"var(--font-family)"}} />
);
export const CardHeader = (p) => (
  <header {...p} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 18px"}} />
);
export const CardTitle = (p) => (
  <h3 {...p} style={{margin:0,fontSize:16,fontWeight:700,color:"var(--fg-strong)"}} />
);
export const CardBody = (p) => (
  <div {...p} style={{padding:"0 18px 16px",fontSize:14,color:"var(--fg-lower)"}} />
);
export const CardFooter = (p) => (
  <footer {...p} style={{padding:"12px 18px",background:"var(--bg-neutral-lower)",fontSize:13,color:"var(--fg-lower)"}} />
);

/* ── 2) Compound API : 하위 컴포넌트를 직접 조립 (커스텀 자유) ── */
export const Card = Object.assign(CardRoot, {
  Header: CardHeader, Title: CardTitle, Body: CardBody, Footer: CardFooter,
});

/* ── 3) Flat API : 자주 쓰는 형태를 primitive로 미리 조립 (간단) ── */
export function FlatCard({ title, actionLabel, onAction, children }) {
  return (
    <CardRoot>
      <CardHeader>
        <CardTitle>{title}</CardTitle>
        {actionLabel && <Button onClick={onAction}>{actionLabel}</Button>}
      </CardHeader>
      <CardBody>{children}</CardBody>
    </CardRoot>
  );
}

/* Button (Flat). 시스템 프로파일(모서리와 두께) 반영 */
export function Button({ variant = "primary", ...p }) {
  const v = {
    primary:   { background:"var(--bg-primary)", color:"#fff" },
    secondary: { background:"var(--bg-primary-low)", color:"var(--fg-primary)" },
    outline:   { background:"var(--bg)", color:"var(--fg-strong)", border:"1px solid var(--border-strong)" },
    danger:    { background:"var(--bg-critical)", color:"#fff" },
  }[variant];
  return <button {...p} style={{font:"inherit",fontWeight:"var(--btn-weight,600)",
    borderRadius:"var(--btn-radius,8px)",padding:"9px var(--btn-padx,16px)",border:0,cursor:"pointer",...v}} />;
}

/* ───────── 사용법 ───────── */
// 1 Flat : 커스텀이 필요 없을 때. 옵션만 채우면 끝
<FlatCard title="월간 리포트" actionLabel="다운로드" onAction={download}>
  이번 달 요약을 확인하세요
</FlatCard>

// 2 Compound : 커스텀이 필요할 때. 직접 조립
<Card>
  <Card.Header>
    <Card.Title>월간 리포트</Card.Title>
    <Button variant="secondary">공유</Button>
  </Card.Header>
  <Card.Body>여기에 원하는 레이아웃을 자유롭게</Card.Body>
  <Card.Footer>최근 업데이트: 1시간 전</Card.Footer>
</Card>`;
  }else{
    body.textContent=aiPrompt(sys);
  }
}


/* ===================== DETAIL WIRING ===================== */
function closeAllOverlays(){document.querySelectorAll('.overlay,.drawer,.menu').forEach(x=>x.classList.remove('open'));}

/* ---- 원문 스펙 섹션 ---- */
// 복사하거나 저장한 뒤 무엇을 하면 되는지 남긴다.
// 알림은 곧 사라져서, 붙여넣다 막히면 다시 볼 곳이 필요하다.
function sayNext(msg){
  const el=document.getElementById('dNext');
  if(!el) return;
  el.hidden=false;
  el.textContent=msg;
}
function copyNext(text, what, how){
  copy(text, what+' \ubcf5\uc0ac\ub428');
  sayNext(what+' '+text.length.toLocaleString()+'\uc790\ub97c \ubcf5\uc0ac\ud588\uc2b5\ub2c8\ub2e4. '+how);
}

function wireSpec(sys){
  const view=$('#specView'); if(!view) return;
  const ed=$('#specEditor'), ta=$('#specText'), st=$('#specState'), rs=$('#specReset');
  function paint(){
    const t=getSpec(sys.id), mine=!!userSpec(sys.id);
    view.textContent=t||'아직 스펙이 없습니다. “내 스펙 붙여넣기”를 누르고 통째로 붙여넣으세요.';
    view.style.opacity=t?'1':'.6';
    const ln=t?t.split('\n').length:0;
    st.textContent=t ? (mine?'내가 넣은 스펙':'원문 스펙')+' · '+ln.toLocaleString()+'줄 · '+t.length.toLocaleString()+'자'
                     : '저장된 스펙 없음';
    rs.style.display=(mine&&builtinSpec(sys.id))?'':'none';
  }
  paint();
  $('#specCopy').onclick=()=>{const t=getSpec(sys.id);
    if(!t){ toast('저장된 스펙이 없습니다'); return; }
    copyNext(t,'원문 스펙',
      '한 글자도 고치지 않은 원본입니다. 프롬프트 앞에 붙여 근거로 쓰세요.');};
  $('#specDown').onclick=()=>{const t=getSpec(sys.id); if(!t){toast('저장된 스펙이 없습니다');return;}
    dl(sys.id+'-spec.md', t, 'text/markdown');
    sayNext(sys.id+'-spec.md 로 저장했습니다. '
      +'프로젝트 docs 폴더에 두고 CLAUDE.md 에서 가리키면 됩니다.');};
  $('#specEdit').onclick=()=>{ta.value=getSpec(sys.id); ed.style.display=''; ta.focus();};
  $('#specCancel').onclick=()=>{ed.style.display='none';};
  $('#specSave').onclick=()=>{
    if(saveSpec(sys.id, ta.value)){ ed.style.display='none'; paint(); renderExport(sys);
      toast(ta.value.trim()?'내 스펙 저장됨':'스펙 비움'); }
    else toast('저장 실패 · 브라우저 저장공간을 확인하세요');
  };
  rs.onclick=()=>{ saveSpec(sys.id,''); paint(); renderExport(sys); toast('원문으로 되돌렸습니다'); };
}

function wireDetail(sys){
  // export
  $('#exportTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;exportFmt=b.dataset.fmt;document.querySelectorAll('#exportTabs button').forEach(x=>x.classList.toggle('on',x===b));renderExport(sys);};
  $('#copyExport').onclick=()=>{
    const HOW={css:'design-tokens.css 로 저장하고 HTML 에서 불러오세요.',
      tw:'tailwind.config.js 에 덮어쓰면 됩니다.',
      json:'디자인 토큰 도구나 스크립트의 입력으로 씁니다.',
      react:'컴포넌트 파일로 저장해 바로 불러 씁니다.',
      ai:'클로드 코드나 채팅창에 붙여넣고 엔터를 누르면 됩니다.',
      spec:'스펙 원문입니다. 프롬프트 앞에 붙여 근거로 쓰세요.'};
    const NM={css:'CSS 변수',tw:'Tailwind',json:'JSON 토큰',
      react:'React 컴포넌트',ai:'AI 프롬프트',spec:'원문 스펙'};
    copyNext($('#exportBody').textContent, NM[exportFmt]||'내보내기', HOW[exportFmt]||'');
  };
  renderExport(sys);
  wireSpec(sys);
  // tabs
  const tp=$('#tabpanel'),tbar=$('#tabbar');
  if(tbar){const texts=['개요 패널 내용입니다.','활동 로그가 여기 표시됩니다.','설정 항목이 여기 표시됩니다.'];
    tbar.onclick=e=>{const b=e.target.closest('button');if(!b)return;tbar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));tp.textContent=texts[+b.dataset.tab];};}
  // pager
  const pg=$('.pager');if(pg)pg.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled||b.textContent.length>1)return;pg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
  // toast
  const tb=$('#toastBtn');if(tb)tb.onclick=()=>toast('저장되었습니다');
  // filter chips (single select)
  const cs=$('#chipset');if(cs)cs.onclick=e=>{const b=e.target.closest('.fchip');if(!b)return;cs.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x===b));};
  // stepper
  const sv=$('#stepVal');if(sv)scope().querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{sv.textContent=Math.max(0,(+sv.textContent)+(+b.dataset.step));});
  // ripple
  const rb=$('#rippleBtn');if(rb)rb.onclick=e=>{const r=document.createElement('span');r.className='rippledot';const rc=rb.getBoundingClientRect();r.style.left=(e.clientX-rc.left)+'px';r.style.top=(e.clientY-rc.top)+'px';rb.appendChild(r);setTimeout(()=>r.remove(),600);};
  // 3D tilt
  const tc=$('#tiltCard');if(tc){tc.onmousemove=e=>{const r=tc.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;tc.style.transform=`perspective(500px) rotateY(${x*16}deg) rotateX(${-y*16}deg)`;};tc.onmouseleave=()=>{tc.style.transform="";};}
  // sliding segmented
  const s2=$('#seg2');if(s2){const ind=s2.querySelector('.ind');const move=b=>{ind.style.width=b.offsetWidth+'px';ind.style.left=b.offsetLeft+'px';};const cur=s2.querySelector('button.on')||s2.querySelector('button');if(cur)requestAnimationFrame(()=>move(cur));s2.querySelectorAll('button').forEach(b=>b.onclick=()=>{s2.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));move(b);});}
  // compound builder

  // 데모 버튼 클릭 피드백 (핸들러 없는 버튼도 반응하게)
  const sc=scope();
  if(sc) sc.addEventListener('click',function(e){
    const b=e.target.closest('button');
    if(!b||b.disabled) return;
    if(b.closest('#exportTabs,#bBlocks,#seg2,#tabbar,.pager,#iconGrid,.stepper,#chipset,.segmented,#cCopy')) return;
    if(b.id==='copyExport'||b.id==='bCopy'||b.id==='toastBtn'||b.id==='ddBtn'||b.id==='rippleBtn') return;
    if(b.hasAttribute('data-open')||b.hasAttribute('data-close')||b.hasAttribute('data-step')) return;

function ensureOverlays(){

function setupFold(){
  const SEC=[
    {t:'\uc5c5\uc885\ubcc4 \ucd94\ucc9c \ud15c\ud50c\ub9bf', sel:'#recs', open:false, limit:0},
    {t:'\ub808\uc774\uc544\uc6c3 \ub808\ud37c\ub7f0\uc2a4', sel:'#layouts', open:false, limit:3},
    {t:'\ucf58\ud150\uce20\ubcc4 \ud654\uba74 \uad6c\uc870', sel:'#pages', open:false, limit:3},
    {t:'\uc81c\uc791 \uaddc\uce59', sel:'.rulegrid', open:false, limit:0}
  ];
  document.querySelectorAll('.sectitle').forEach(function(h){
    const txt=h.textContent.replace(/\s+/g,' ').trim();
    const cfg=SEC.find(function(x){return txt.indexOf(x.t)===0;});
    if(!cfg) return;
    // 본문 = 제목 다음 형제들 (다음 sectitle 전까지)
    const body=document.createElement('div'); body.className='foldbody';
    let n=h.nextElementSibling;
    while(n && !n.classList.contains('sectitle')){ const nx=n.nextElementSibling; body.appendChild(n); n=nx; }
    h.parentNode.insertBefore(body, h.nextSibling);
    // 개수 표시
    const grid=body.querySelector(cfg.sel);
    const total=grid?grid.children.length:0;
    h.insertAdjacentHTML('afterbegin','<span class="fold">\u25bc</span>');
    h.insertAdjacentHTML('beforeend','<span class="cnt">'+(total?total+'\uac1c':'')+'</span>');
    // 일부만 노출 + 더보기
    if(grid && cfg.limit && total>cfg.limit){
      Array.from(grid.children).forEach(function(c,i){ if(i>=cfg.limit) c.style.display='none'; });
      const btn=document.createElement('button'); btn.className='morebtn';
      btn.textContent='\uc804\uccb4 '+total+'\uac1c \ubcf4\uae30 \u25be';
      btn.onclick=function(){
        const hidden=grid.querySelector('[style*="display: none"]');
        if(hidden){ Array.from(grid.children).forEach(function(c){c.style.display='';});
          btn.textContent='\uc811\uae30 \u25b4'; }
        else { Array.from(grid.children).forEach(function(c,i){ if(i>=cfg.limit) c.style.display='none'; });
          btn.textContent='\uc804\uccb4 '+total+'\uac1c \ubcf4\uae30 \u25be'; }
      };
      grid.parentNode.insertBefore(btn, grid.nextSibling);
    }
    // 기본 접힘
    if(!cfg.open){ h.classList.add('closed'); body.classList.add('hide'); }
    h.onclick=function(){ h.classList.toggle('closed'); body.classList.toggle('hide'); };
  });
}

/* ---------- 토큰 ---------- */
:root{

/* ---------- 바탕과 한글 줄바꿈 ----------
   브라우저 기본값은 한글을 글자 단위로 끊어 단어가 쪼개진다.
   단어 단위로 바뀌게 처음부터 지정한다. */

/* ---------- 글자 단 ---------- */
h1,.hero h1{

/* ---------- 면은 직각, 그림자 없음 ---------- */
.card,.panel,.out,.stage,.frame,.search,.searchbar,.composer,.cout,.export,
.note,.infobox,.dscard,.addcard,.lcard,.rec,.foldbody,.specview,.specta,
.rulebox,.myrules,.qa,.case,.file,.c,.st,.preview,.gcard,.layprev,.brief,

}
.dscard,.lcard,.rec,.c,.file,.qa,.case{

  transition:border-color .8s var(--ease);
}
.dscard:hover,.lcard:hover,.rec:hover,.c:hover,.file:hover{

  border-color:var(--ui-line);
}
.export,.cout{ background:var(--obsidian); color:var(--paper); }

/* ---------- 간격 ---------- */

@media(max-width:768px){
