<!doctype html>
<html lang="ko" data-ui="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지 생성기 · 레퍼런스 + 규칙 + 디자인시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root,:root[data-ui="light"]{
  --ui-canvas:#F6F5F2;--ui-panel:#FFFFFF;--ui-panel-2:#F2F0EB;
  --ui-fg:#17161B;--ui-fg-strong:#2A2830;--ui-fg-lower:#5E5A63;--ui-fg-dim:#A9A6AE;
  --ui-border:#E7E4DD;--ui-border-low:#F0EDE6;--ui-accent:#A24E38;
  --ui-sh:0 1px 3px rgba(30,24,50,.06);--ui-sh-md:0 6px 20px rgba(30,24,50,.09);
}
:root[data-ui="dark"]{
  --ui-canvas:#141317;--ui-panel:#1C1B21;--ui-panel-2:#232128;
  --ui-fg:#F4F3F7;--ui-fg-strong:#FFFFFF;--ui-fg-lower:#A6A3AE;--ui-fg-dim:#6E6B75;
  --ui-border:#302E38;--ui-border-low:#26242C;--ui-accent:#E0917A;
  --ui-sh:0 1px 3px rgba(0,0,0,.5);--ui-sh-md:0 6px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ui-canvas);color:var(--ui-fg);line-height:1.55;-webkit-font-smoothing:antialiased;
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;}
button{font:inherit;}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:13px 24px;
  background:color-mix(in srgb,var(--ui-canvas) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ui-border);}
.top .logo{font-family:"Space Grotesk",Pretendard,sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.top .mk{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 140deg,#A24E38,#C98A5B,#3F5E56,#A24E38);}
.top .sp{flex:1;}
.appnav{display:flex;gap:4px;background:var(--ui-panel-2);border:1px solid var(--ui-border);border-radius:11px;padding:3px;}
.appnav a{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ui-fg-lower);
  text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;}
.appnav a:hover{color:var(--ui-fg-strong);background:var(--ui-panel);}
.appnav a.on{background:var(--ui-accent);color:#fff;}
@media(max-width:640px){.appnav a span{display:none;}}

.tbtn{border:1px solid var(--ui-border);background:var(--ui-panel);color:var(--ui-fg-lower);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:12.5px;}
.tbtn:hover{color:var(--ui-fg-strong);}
.tbtn.pri{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700;}

.wrap{display:grid;grid-template-columns:360px 1fr;gap:22px;max-width:1500px;margin:0 auto;padding:22px 24px 60px;}
@media(max-width:980px){.wrap{grid-template-columns:1fr;}}
.panel{background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:16px;padding:18px;box-shadow:var(--ui-sh);
  position:sticky;top:70px;max-height:calc(100vh - 92px);overflow-y:auto;}
@media(max-width:980px){.panel{position:static;max-height:none;}}
.step{margin-bottom:20px;}
.step>label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ui-fg-lower);margin-bottom:8px;}
.step>label i{width:18px;height:18px;border-radius:6px;background:var(--ui-accent);color:#fff;display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:800;flex:none;}
select.sel{width:100%;font:inherit;font-size:13px;padding:10px 11px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);cursor:pointer;}
select.sel:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ui-fg-strong);padding:5px 0;cursor:pointer;line-height:1.55;}
.chk input{margin:2px 0 0;accent-color:var(--ui-accent);flex:none;width:15px;height:15px;}
.chk small{display:block;color:var(--ui-fg-dim);font-size:11px;}
.brief input,.brief textarea{width:100%;font:inherit;font-size:12.5px;padding:9px 11px;border:1px solid var(--ui-border);
  border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);margin-bottom:7px;font-family:inherit;}
.brief textarea{min-height:110px;resize:vertical;line-height:1.65;}
.brief input:focus,.brief textarea:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.brief .lbl{font-size:11px;color:var(--ui-fg-dim);margin:-3px 0 4px 2px;}
.exbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.exbtns button{border:1px dashed var(--ui-border);background:var(--ui-panel-2);color:var(--ui-fg-lower);
  font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer;}
.exbtns button:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
.ruleadd{display:flex;gap:6px;margin-top:8px;}
.ruleadd input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel-2);color:var(--ui-fg);}
.ruleadd button{border:0;background:var(--ui-accent);color:#fff;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;}
.mylist{list-style:none;margin:8px 0 0;padding:0;}
.mylist li{display:flex;gap:6px;font-size:12px;color:var(--ui-fg-strong);padding:4px 0;border-bottom:1px solid var(--ui-border-low);}
.mylist .x{margin-left:auto;border:0;background:none;color:var(--ui-fg-dim);cursor:pointer;font-size:14px;}
.infobox{margin-top:9px;background:var(--ui-panel-2);border:1px solid var(--ui-border);border-radius:11px;padding:11px 13px;}
.infobox .ir{display:flex;gap:8px;font-size:11.5px;line-height:1.7;padding:3px 0;}
.infobox .ik{flex:none;width:52px;font-weight:800;color:var(--ui-accent);}
.infobox .iv{color:var(--ui-fg-lower);}
.infobox .iv b{color:var(--ui-fg-strong);}
.metarow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.metarow span{font-size:11px;font-weight:700;background:var(--ui-panel);border:1px solid var(--ui-border);
  color:var(--ui-fg-lower);padding:3px 9px;border-radius:999px;}
.layprev{margin-top:9px;background:var(--ui-panel-2);border:1px solid var(--ui-border);border-radius:11px;
  padding:10px;display:flex;flex-direction:column;gap:6px;height:132px;}
.layprev .b{background:var(--ui-border);border-radius:4px;}
.layprev .a{background:color-mix(in srgb,var(--ui-accent) 42%,var(--ui-border));border-radius:4px;}
.layprev .r{display:flex;gap:6px;flex:1;}
.laycap{font-size:11px;color:var(--ui-fg-dim);margin-top:6px;line-height:1.6;}
.laycap b{color:var(--ui-fg-strong);}
.hint{font-size:11px;color:var(--ui-fg-dim);margin-top:6px;line-height:1.6;}
.autoinfo{font-size:11.5px;color:var(--ui-fg-dim);text-align:center;padding:10px;background:var(--ui-panel-2);border-radius:10px;}
.gobtn{width:100%;border:0;background:var(--ui-fg-strong);color:var(--ui-canvas);font-size:14px;font-weight:800;padding:13px;border-radius:11px;cursor:pointer;margin-top:4px;}
.gobtn:hover{filter:brightness(1.15);}

.stage{display:flex;flex-direction:column;gap:16px;min-width:0;}
.card{background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:16px;padding:18px;box-shadow:var(--ui-sh);}
.card h3{margin:0 0 2px;font-size:14px;font-weight:800;}
.card .csub{font-size:11.5px;color:var(--ui-fg-dim);margin-bottom:12px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}
.tabs button{border:1px solid var(--ui-border);background:var(--ui-panel-2);color:var(--ui-fg-lower);font-size:12.5px;padding:7px 13px;border-radius:9px;cursor:pointer;}
.tabs button.on{background:var(--ui-fg-strong);color:var(--ui-canvas);border-color:transparent;font-weight:700;}
.frame{width:100%;height:min(78vh,900px);border:1px solid var(--ui-border);border-radius:12px;background:#fff;}
.dev{display:flex;gap:6px;margin-bottom:10px;}
.dev button{border:1px solid var(--ui-border);background:var(--ui-panel-2);color:var(--ui-fg-lower);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;}
.dev button.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700;}
.out{position:relative;background:#0d1117;color:#c9d1d9;border-radius:11px;padding:15px;font-family:"Roboto Mono",monospace;
  font-size:11.5px;line-height:1.65;max-height:520px;overflow:auto;white-space:pre;}
.out .cp{position:absolute;top:10px;right:10px;background:#238636;color:#fff;border:0;border-radius:7px;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;}
.secpick{max-height:230px;overflow:auto;border:1px solid var(--ui-border);border-radius:10px;padding:8px 10px;background:var(--ui-panel-2);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ui-fg-strong);color:var(--ui-canvas);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="top">
  <div class="logo"><span class="mk"></span>페이지 생성기 <span style="color:var(--ui-fg-dim);font-weight:500">레퍼런스 + 규칙 + 디자인시스템</span></div>
  <nav class="appnav"><a href="library.html">📚<span>모음집</span></a><a href="builder.html">🎛<span>조립기</span></a><a href="generator.html" class="on">⚡<span>생성기</span></a><a href="guide.html">📖<span>설명서</span></a></nav><div class="sp"></div>
  <button class="tbtn" id="btnUi">◐</button>
  <button class="tbtn" id="btnDown">⬇ HTML 저장</button>
  <button class="tbtn pri" id="btnOpen">↗ 새 탭에서 열기</button>
</div>

<div class="wrap">
  <aside class="panel">
    <div class="step brief">
      <label><i>0</i>프로젝트 정보 <span style="font-weight:600;color:var(--ui-fg-dim);margin-left:auto">선택</span></label>
      <input id="bName" placeholder="이름 (예: 루미에르 세라마이드 에센스 / 밝은미소치과)">
      <input id="bTag" placeholder="한 줄 소개 (예: 무너진 장벽을 4주 만에)">
      <div class="lbl">참고 자료 — 있는 대로 붙여넣으세요 (성분·가격·진료과목·메뉴 등)</div>
      <div class="exbtns" id="exBtns">
        <button data-ex="beauty">뷰티 예시</button>
        <button data-ex="clinic">병원 예시</button>
        <button data-ex="menu">메뉴판 예시</button>
        <button data-ex="clear">비우기</button>
      </div>
      <textarea id="bMat" placeholder="예)&#10;· 용량 50ml / 가격 38,000원&#10;· 핵심성분: 세라마이드NP 5%, 판테놀, 마데카소사이드&#10;· 임상: 4주 후 수분 42% 증가 (32명)&#10;· 타깃: 건성·민감성&#10;· 브랜드 톤: 담백하고 임상적"></textarea>
    </div>

    <div class="step">
      <label><i>1</i>콘텐츠 구조 (레퍼런스)</label>
      <select class="sel" id="selPage"></select>
      <div class="infobox" id="pageInfo"></div>
    </div>

    <div class="step">
      <label><i>2</i>포함할 섹션</label>
      <div class="secpick" id="secPick"></div>
    </div>

    <div class="step">
      <label><i>3</i>레이아웃 배치</label>
      <select class="sel" id="selLayout">
        <option value="alt">모듈러 그리드 — 좌우 지그재그</option>
        <option value="stack">단일 열 — 위에서 아래로</option>
        <option value="center">가운데 정렬 — 좁은 폭</option>
        <option value="split">Split — 사진 | 글 반반 고정</option>
      </select>
      <div class="layprev" id="layPrev"></div>
      <div class="infobox" id="layInfo"></div>
    </div>

    <div class="step">
      <label><i>4</i>디자인 시스템</label>
      <select class="sel" id="selSys"></select>
      <div style="margin-top:8px"><label class="chk"><input type="checkbox" id="darkMode"> 다크 모드로 생성</label></div>
      <div class="hint">원하는 시스템이 없나요? <a href="builder.html" style="color:var(--ui-accent);font-weight:700">조립기에서 색으로 직접 만들기 →</a></div>
    </div>

    <div class="step">
      <label><i>5</i>규칙</label>
      <label class="chk"><input type="checkbox" id="rRes" checked> 반응형 (vw · clamp)<small>768px 미만 1열, min(1200px,92vw)</small></label>
      <label class="chk"><input type="checkbox" id="rImg" checked> 이미지 규격 표기<small>플레이스홀더에 권장 사이즈 표시</small></label>
      <label class="chk"><input type="checkbox" id="rA11y" checked> 접근성<small>focus-visible, 대비, aria</small></label>
      <label class="chk"><input type="checkbox" id="rBan" checked> AI 슬롭 금지<small>보라 강조·좌측보더 인용카드 배제</small></label>
      <label class="chk"><input type="checkbox" id="rMotion"> 스크롤 등장 애니메이션</label>
      <div class="ruleadd"><input id="ruleIn" placeholder="내 규칙 추가"><button id="ruleAdd">+</button></div>
      <ul class="mylist" id="myList"></ul>
    </div>

    <div class="autoinfo">고르는 즉시 오른쪽에 반영됩니다</div>
  </aside>

  <main class="stage">
    <div class="card">
      <div class="tabs" id="viewTabs">
        <button data-v="preview" class="on">미리보기</button>
        <button data-v="code">HTML 코드</button>
        <button data-v="prompt">AI 프롬프트</button>
      </div>
      <div id="paneP">
        <div class="dev" id="devBar">
          <button data-w="100%" class="on">데스크톱</button>
          <button data-w="820px">태블릿</button>
          <button data-w="390px">모바일</button>
        </div>
        <iframe class="frame" id="frame"></iframe>
      </div>
      <div id="paneC" style="display:none"><div class="out"><button class="cp" id="cpCode">📋 복사</button><span id="codeBody"></span></div></div>
      <div id="paneR" style="display:none"><div class="out"><button class="cp" id="cpPrompt">📋 복사</button><span id="promptBody"></span></div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500);};
const copy=(t,m)=>navigator.clipboard.writeText(t).then(()=>toast(m||'복사됨'));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===== 디자인 시스템 (모음집과 동일 값) ===== */
const SYS=[
 {id:'toss',n:'Toss (TDS)',p:'#3182F6',pl:'#E8F3FF',pd:'#1B64DA',g:['#F9FAFB','#F2F4F6','#E5E8EB','#8B95A1','#4E5968','#191F28'],f:'"Pretendard Variable",Pretendard,system-ui,sans-serif',r:10,rc:16},
 {id:'airbnb',n:'Airbnb',p:'#FF385C',pl:'#FFF0F3',pd:'#BD163A',g:['#F7F7F7','#EBEBEB','#DDDDDD','#767676','#484848','#222222'],f:'"Manrope",Pretendard,system-ui,sans-serif',r:10,rc:16},
 {id:'carbon',n:'IBM Carbon',p:'#0F62FE',pl:'#EDF5FF',pd:'#002D9C',g:['#F4F4F4','#E0E0E0','#C6C6C6','#6F6F6F','#393939','#161616'],f:'"IBM Plex Sans",system-ui,sans-serif',r:0,rc:0},
 {id:'m3',n:'Material 3',p:'#6750A4',pl:'#EADDFF',pd:'#4F378B',g:['#F5EFF7','#E6E1E5','#CAC4D0','#79747E','#49454F','#1C1B1F'],f:'"Roboto","Helvetica Neue",Arial,sans-serif',r:999,rc:16},
 {id:'polaris',n:'Shopify Polaris',p:'#008060',pl:'#E6F4F0',pd:'#005541',g:['#FAFBFB','#F1F2F4','#E3E5E7','#6D7175','#4A4E52','#303030'],f:'"Inter",system-ui,sans-serif',r:8,rc:12},
 {id:'vercel',n:'Vercel / Geist',p:'#171717',pl:'#F2F2F2',pd:'#000000',g:['#FAFAFA','#F2F2F2','#EBEBEB','#737373','#404040','#171717'],f:'"DM Sans",system-ui,sans-serif',r:6,rc:8},
 {id:'gitlab',n:'GitLab',p:'#FC6D26',pl:'#FFF3EC',pd:'#B93316',g:['#FBFAFD','#ECECEF','#DCDCDE','#666666','#404040','#1F1E24'],f:'"Sora",system-ui,sans-serif',r:6,rc:8},
 {id:'slack',n:'Slack',p:'#8A2E95',pl:'#F7EFF8',pd:'#4A154B',g:['#F8F8FA','#F0F0F2','#E2E2E6','#6E6E77','#3F3F44','#1A1A1D'],f:'"Pretendard Variable",Pretendard,system-ui,sans-serif',r:8,rc:12},
 {id:'editorial',n:'Editorial (세리프)',p:'#B91C1C',pl:'#FBEEEE',pd:'#7E1010',g:['#FAF8F3','#F1EDE4','#E2DBCC','#857A5F','#453F30','#1A1813'],f:'"Playfair Display",Georgia,serif',r:2,rc:4},
 {id:'mobile',n:'Mobile Kit (민트)',p:'#0FB39B',pl:'#ECFDFA',pd:'#0A7266',g:['#F7F9FA','#EEF1F3','#E0E5E8','#6E7A82','#3B444B','#151A1E'],f:'"Pretendard Variable",Pretendard,system-ui,sans-serif',r:14,rc:20},
 {id:'neon',n:'Neon (랜딩)',p:'#7C4DFF',pl:'#F3F0FF',pd:'#5A1FD9',g:['#F5F6FA','#E9EBF2','#D2D6E3','#565B75','#2A2D3E','#0F1018'],f:'"Space Grotesk",Pretendard,sans-serif',r:14,rc:20},
 {id:'playful',n:'Playful (캔디)',p:'#F72AAA','pl':'#FFF0FA',pd:'#B00F72',g:['#FAF8FF','#F1EDFB','#E2DAF3','#7E6BA8','#443A5F','#1A1626'],f:'"Poppins",Pretendard,sans-serif',r:999,rc:22}
];

/* ===== 콘텐츠 구조 (실제 사이트 레퍼런스 기반) ===== */

function imgSpec(t){
  const R=[[/히어로|제품 컷|목업|스테이트먼트/,'대표 이미지','1920×1080 (16:9) · 모바일 1080×1350','16/9'],
   [/시설|갤러리|공간|워크|케이스|사진/,'갤러리 이미지','1200×900 (4:3) 통일','4/3'],
   [/성분|아이콘|연동|배지|기능 카드/,'아이콘','SVG 권장 · PNG 96×96 (@2x 192)','1/1'],
   [/의료진|팀|프로필|셰프/,'인물 사진','800×800 (1:1), 상반신','1/1'],
   [/메뉴|시그니처|코스/,'메뉴 사진','1200×900 (4:3), 45° 촬영','4/3'],
   [/텍스처|상세컷|스와치/,'세로 상세컷','가로 860~1000px 고정','3/4'],
   [/UI 데모|스크린샷|대시보드/,'제품 UI','2560×1440 실제 화면 캡처','16/9'],
   [/로고/,'로고','SVG 또는 PNG 높이 80px (@2x 160)','3/1'],
   [/리뷰|후기|포토/,'포토리뷰','600×600 (1:1)','1/1'],
   [/지도|오시는 길/,'지도','1200×675, 캡처 또는 임베드','16/9']];
  for(const [rx,label,size,ar] of R) if(rx.test(t)) return {label,size,ar};
  return null;
}

    + '<div class="metarow"><span>섹션 '+cur.s.length+'개</span><span>이미지 '+nImg+'곳</span>'

}

   ex:'Stripe 문서, 노션 공유 페이지, 뉴스레터',
   tip:'한 줄 <b>45~75자</b>가 가장 읽기 좋습니다. 폭을 더 넓히지 마세요',
   sec:'3~7개 섹션', mob:'여백만 줄고 구조 동일'},
 split:{w:'<div class="r"><div class="a" style="flex:1"></div><div class="b" style="flex:1"></div></div>',
   n:'반반 (스플릿)',
   c:'화면을 정확히 둘로 나눠 사진과 글이 마주봅니다. 첫인상이 강하고 정돈돼 보입니다.',
   use:'브랜드 소개 첫 화면, 로그인·회원가입, 채용 공고',
   avoid:'섹션이 많을 때. 같은 구조가 반복되면 단조로워집니다',
   ex:'에어비앤비 호스트 소개, 각종 SaaS 로그인 화면',
   tip:'왼쪽 사진은 <b>인물이나 공간</b>처럼 여백이 있는 컷이 좋습니다',
   sec:'1~4개 섹션', mob:'세로로 쌓임 (사진 위 / 글 아래)'}
};
function infoRows(rows){
  return rows.filter(function(r){return r[1];}).map(function(r){
    return '<div class="ir"><span class="ik">'+r[0]+'</span><span class="iv">'+r[1]+'</span></div>';
  }).join('');
}
function renderLayPrev(){
  const v=$('#selLayout').value, d=LAYPREV[v]||LAYPREV.alt;
  $('#layPrev').innerHTML=d.w;
  $('#layInfo').innerHTML='<div style="font-size:12.5px;font-weight:800;color:var(--ui-fg-strong);margin-bottom:5px">'+d.n+'</div>'
    +'<div style="font-size:11.5px;color:var(--ui-fg-lower);line-height:1.7;margin-bottom:6px">'+d.c+'</div>'
    +infoRows([['추천',d.use],['주의',d.avoid],['사례',d.ex],['팁',d.tip]])
    +'<div class="metarow"><span>'+d.sec+'</span><span>'+d.mob+'</span></div>';
}
function build(silent){
  const s=SYS[+$('#selSys').value], lay=$('#selLayout').value, dark=$('#darkMode').checked;
  const secs=cur.s.map((x,k)=>({t:x[0],d:x[1],k})).filter(x=>picked.has(x.k));
  const showSpec=$('#rImg').checked, motion=$('#rMotion').checked, a11y=$('#rA11y').checked;
  const bg = dark? s.g[5] : '#FFFFFF', canvas = dark? '#0E0E11' : s.g[0];
  const fg = dark? '#FFFFFF' : s.g[5], fgLow = dark? s.g[2] : s.g[3], border = dark? s.g[4] : s.g[2];
  const prim = dark? s.p : s.p, primLow = dark? s.g[4] : s.pl;

  const bN=$('#bName').value.trim(), bT=$('#bTag').value.trim();
  let body='';
  secs.forEach((sec,i)=>{
    const sp=imgSpec(sec.t);
    const ph = sp ? '<div class="ph" style="aspect-ratio:'+sp.ar+'">'
        + (showSpec? '<span class="phl">'+esc(sp.label)+'</span><span class="phs">'+esc(sp.size)+'</span>' : '<span class="phl">이미지</span>')
        + '</div>' : '';
    const hTitle = (i===0 && bN) ? bN : sec.t;
    const hDesc  = (i===0 && bT) ? bT : sec.d;
    const txt = '<div class="tx"><span class="num">'+(i===0&&bN?esc(sec.t):String(i+1).padStart(2,'0'))+'</span>'
        + '<h2>'+esc(hTitle)+'</h2><p>'+esc(hDesc)+'</p>'
        + (i===0? '<div class="cta"><a class="btn" href="#">자세히 보기</a><a class="btn2" href="#">문의하기</a></div>':'')
        + '</div>';
    const cls = lay==='alt' ? (i%2? 'sec alt':'sec') : lay==='center'? 'sec narrow' : lay==='split'? 'sec split':'sec stack';
    body += '\n  <!-- '+(i+1)+'. '+sec.t+' -->\n  <section class="'+cls+'"'+(motion?' data-rv':'')+'>\n    <div class="inner">'
         + (ph && lay!=='center' ? ph : '') + txt + (ph && lay==='center' ? ph : '') + '</div>\n  </section>';
  });

  const css = [
'    :root{',
'      --primary: '+prim+';  --primary-low: '+primLow+';  --primary-dark: '+s.pd+';',
'      --bg: '+bg+';  --canvas: '+canvas+';  --fg: '+fg+';  --fg-low: '+fgLow+';  --border: '+border+';',
'      --r-btn: '+(s.r===999?'999px':s.r+'px')+';  --r-card: '+s.rc+'px;',
'      --font: '+s.f+';',
'      --pad: clamp(24px, 5vw, 80px);',
'      --w: min(1200px, 92vw);',
'    }',
'    *{box-sizing:border-box;}',
'    body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--font);line-height:1.65;',
'      -webkit-font-smoothing:antialiased;}',
'    .sec{padding:var(--pad) 0;}',
'    .sec:nth-child(even){background:var(--bg);}',
'    .inner{width:var(--w);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center;}',
'    .sec.alt .inner{direction:rtl;} .sec.alt .inner>*{direction:ltr;}',
'    .sec.stack .inner,.sec.narrow .inner{grid-template-columns:1fr;}',
'    .sec.narrow .inner{width:min(760px,92vw);text-align:center;}',
'    .sec.narrow .cta{justify-content:center;}',
'    .ph{width:100%;background:var(--primary-low);border:1px dashed var(--border);border-radius:var(--r-card);',
'      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--primary-dark);}',
'    .phl{font-size:clamp(13px,1.6vw,15px);font-weight:700;}',
'    .phs{font-size:12px;opacity:.75;font-family:ui-monospace,Menlo,monospace;}',
'    .num{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--primary);}',
'    h2{font-size:clamp(20px,3.2vw,38px);line-height:1.25;letter-spacing:-.02em;margin:8px 0 10px;}',
'    p{font-size:clamp(14px,1.6vw,17px);color:var(--fg-low);margin:0;}',
'    .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}',
'    .btn,.btn2{display:inline-block;padding:12px 22px;border-radius:var(--r-btn);font-weight:700;font-size:15px;text-decoration:none;}',
'    .btn{background:var(--primary);color:#fff;}',
'    .btn2{background:var(--primary-low);color:var(--primary-dark);}',
a11y?'    a:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}':'',
'    @media(max-width:768px){ .inner{grid-template-columns:1fr!important;} .sec.alt .inner{direction:ltr;} }',
motion?'    [data-rv]{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;}\n    [data-rv].in{opacity:1;transform:none;}\n    @media(prefers-reduced-motion:reduce){[data-rv]{opacity:1;transform:none;transition:none;}}':''
].filter(Boolean).join('\n');

  const js = motion ? '\n<script>\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});\ndocument.querySelectorAll("[data-rv]").forEach(el=>io.observe(el));\n<\/script>' : '';

  html = '<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>'+esc(bN || cur.n)+'</title>\n'
    + '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">\n'
    + '<style>\n'+css+'\n</style>\n</head>\n<body>'+body+'\n'+js+'\n</body>\n</html>';

  $('#frame').srcdoc=html;
  $('#codeBody').textContent=html;
  $('#promptBody').textContent=prompt(s,lay,secs,css);
  if(!silent) toast('생성 완료 — '+secs.length+'개 섹션');
}
function prompt(s,lay,secs,css){
  const layName={alt:'모듈러 그리드(좌우 지그재그) — 홀수 행은 이미지 왼쪽, 짝수 행은 오른쪽',
                 stack:'단일 열 — 위에서 아래로 순서대로',
                 center:'가운데 정렬 — min(760px,92vw) 좁은 폭, 텍스트 중앙',
                 split:'Split — 이미지 | 텍스트 반반 고정'}[lay];
  const L=[];
  const b=brief();
  L.push('# '+((b.n&&b.n.trim())||cur.n)+' 제작 요청');
  L.push('');
  L.push('아래 스펙 그대로 **단일 HTML 파일**을 만들어줘. 값은 임의로 바꾸지 말고 그대로 쓸 것.');
  L.push('');
  if((b.n&&b.n.trim())||(b.t&&b.t.trim())||(b.m&&b.m.trim())){
    L.push('## 0) 실제 프로젝트 정보 (이 내용으로 카피를 써 줘)');
    if(b.n&&b.n.trim()) L.push('- 이름: '+b.n.trim());
    if(b.t&&b.t.trim()) L.push('- 한 줄 소개: '+b.t.trim());
    if(b.m&&b.m.trim()){
      L.push('- 참고 자료:');
      L.push('```');
      L.push(b.m.trim());
      L.push('```');
    }
    L.push('');
    L.push('**중요**: 아래 섹션 설명은 "무엇을 넣을지"에 대한 안내다. 실제 문구는 위 자료를 근거로 쓰고,');
    L.push('자료에 없는 수치·효능·인증은 지어내지 말 것. 부족하면 자리표시자로 남기고 무엇이 필요한지 표시할 것.');
    L.push('');
  }
  L.push('## 1) 레이아웃');
  L.push('- '+layName);
  L.push('- 참고 사이트: '+cur.refs);
  L.push('');
  L.push('## 2) 섹션 (이 순서 그대로, 각 섹션 앞에 주석)');
  secs.forEach(function(x,i){
    const sp=imgSpec(x.t);
    L.push('');
    L.push((i+1)+'. **'+x.t+'**');
    L.push('   - 내용: '+x.d);
    L.push('   - 마크업: <section class="'+(lay==='alt'?(i%2?'sec alt':'sec'):lay==='center'?'sec narrow':lay==='split'?'sec split':'sec stack')+'"> > .inner');
    if(sp){
      L.push('   - 이미지 슬롯: '+sp.label+' · 권장 '+sp.size+' · aspect-ratio: '+sp.ar);
      L.push('     → <div class="ph" style="aspect-ratio:'+sp.ar+'"> 안에 라벨과 규격 텍스트를 표시 (실제 이미지 없이 플레이스홀더)');
    } else {
      L.push('   - 이미지 없음 (텍스트 블록만)');
    }
    if(i===0) L.push('   - 이 섹션에만 CTA 버튼 2개 (.btn 기본 / .btn2 보조)');
  });
  L.push('');
  L.push('## 3) 디자인 토큰 — '+s.n+' (아래 CSS를 그대로 사용)');
  L.push('```css');
  L.push(css);
  L.push('```');
  L.push('');
  L.push('## 4) 규칙');
  rulesText().forEach(function(r){L.push(r);});
  L.push('');
  L.push('## 5) 출력 형식');
  L.push('- 의존성 없는 단일 HTML 파일 (Pretendard CDN 링크만 허용)');
  L.push('- 위 CSS를 <style>에 그대로 넣고, 섹션 마크업만 추가');
  L.push('- 클래스명: .sec / .sec.alt / .sec.narrow / .sec.stack / .inner / .ph / .phl / .phs / .tx / .num / .cta / .btn / .btn2');
  L.push('- 이미지는 전부 플레이스홀더(.ph)로, 실제 파일 참조 금지');
  return L.join('\n');
}

/* ===== 배선 ===== */
const auto=()=>{try{build(true);}catch(e){}};
['#selPage','#selLayout','#selSys','#darkMode','#rRes','#rImg','#rA11y','#rBan','#rMotion'].forEach(function(id){
  const el=$(id); if(el) el.addEventListener('change',auto);
});
$('#selLayout').addEventListener('change',renderLayPrev);
$('#secPick').addEventListener('change',auto);
['#bName','#bTag','#bMat'].forEach(function(id){
  const el=$(id); if(el) el.addEventListener('input',function(){ saveBrief(); clearTimeout(el._t); el._t=setTimeout(auto,350); });
});
$('#exBtns').onclick=function(e){
  const b=e.target.closest('[data-ex]'); if(!b) return;
  const k=b.dataset.ex;
  if(k==='clear'){ $('#bName').value=''; $('#bTag').value=''; $('#bMat').value=''; }
  else { const x=EX[k]; $('#bName').value=x.n; $('#bTag').value=x.t; $('#bMat').value=x.m; }
  saveBrief(); auto();
};
$('#myList').addEventListener('click',()=>setTimeout(auto,0));
$('#ruleAdd').addEventListener('click',()=>setTimeout(auto,0));
$('#viewTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $('#viewTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const v=b.dataset.v;
  $('#paneP').style.display=v==='preview'?'':'none';
  $('#paneC').style.display=v==='code'?'':'none';
  $('#paneR').style.display=v==='prompt'?'':'none';};
$('#devBar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  $('#devBar').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const f=$('#frame'); f.style.width=b.dataset.w; f.style.margin=b.dataset.w==='100%'?'':'0 auto'; f.style.display='block';};
$('#cpCode').onclick=()=>copy(html,'HTML 복사됨');
$('#cpPrompt').onclick=()=>copy($('#promptBody').textContent,'프롬프트 복사됨');
$('#btnDown').onclick=()=>{if(!html){toast('먼저 생성하세요');return;}
  const b=new Blob([html],{type:'text/html;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=cur.n.replace(/[^\w가-힣]/g,'_')+'.html'; a.click(); toast('저장됨');};
$('#btnOpen').onclick=()=>{if(!html){toast('먼저 생성하세요');return;}
  const w=window.open(); w.document.write(html); w.document.close();};
$('#btnUi').onclick=()=>{const r=document.documentElement;r.setAttribute('data-ui',r.getAttribute('data-ui')==='dark'?'light':'dark');};

(function(){ const b=brief();
  if(b.n) $('#bName').value=b.n; if(b.t) $('#bTag').value=b.t; if(b.m) $('#bMat').value=b.m;
})();
loadPage(0); renderMy(); renderLayPrev(); build();
</script>
</body>
</html>
