<style>
:root,:root[data-ui="light"]{
  --ui-canvas:#F6F5F2;--ui-panel:#FFFFFF;--ui-panel-2:#F2F0EB;
  --ui-fg:#17161B;--ui-fg-strong:#2A2830;--ui-fg-lower:#5E5A63;--ui-fg-dim:#A9A6AE;
  --ui-border:#E7E4DD;--ui-border-low:#F0EDE6;--ui-accent:#A24E38;
  --ui-sh:0 1px 3px rgba(30,24,50,.06);--ui-sh-md:0 6px 20px rgba(30,24,50,.09);
}
*{box-sizing:border-box;}
body{margin:0;-webkit-font-smoothing:antialiased;}
button{font:inherit;}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;}
.top .logo{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;color:inherit;}
.top .mk{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 140deg,#A24E38,#C98A5B,#3F5E56,#A24E38);}
.top .sp{flex:1;}
.appnav{display:flex;}
.appnav a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;}
@media(max-width:640px){.appnav{overflow-x:auto;}.appnav a{font-size:13px;padding:6px 12px;white-space:nowrap;}}

.tbtn{cursor:pointer;}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:22px;margin:0 auto;padding:22px 24px 60px;}
@media(max-width:980px){.wrap{grid-template-columns:1fr;}}
.panel{background:var(--ui-panel);border:1px solid var(--ui-border);padding:18px;position:sticky;top:70px;max-height:calc(100vh - 92px);overflow-y:auto;}
@media(max-width:980px){.panel{position:static;max-height:none;}}
.step{margin-bottom:20px;}
.step>label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ui-fg-lower);margin-bottom:8px;}
.step>label i{width:18px;height:18px;border-radius:6px;background:var(--ui-accent);color:#fff;display:grid;place-items:center;font-size:10px;font-style:normal;font-weight:800;flex:none;}
select.sel{width:100%;font:inherit;font-size:13px;padding:10px 11px;border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);cursor:pointer;}
select.sel:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ui-fg-strong);padding:5px 0;cursor:pointer;line-height:1.55;}
.chk input{margin:2px 0 0;accent-color:var(--ui-accent);flex:none;width:15px;height:15px;}
.chk small{display:block;color:var(--ui-fg-dim);font-size:11px;}
.brief input,.brief textarea{width:100%;font:inherit;font-size:12.5px;padding:9px 11px;border:1px solid var(--ui-border);
  border-radius:10px;background:var(--ui-panel-2);color:var(--ui-fg);margin-bottom:7px;font-family:inherit;}
.brief textarea{min-height:110px;resize:vertical;line-height:1.65;}
.brief input:focus,.brief textarea:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;}
.brief .lbl{font-size:11px;color:var(--ui-fg-dim);margin:-3px 0 4px 2px;}
.exbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.exbtns button{cursor:pointer;}
.exbtns button:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
.ruleadd{display:flex;gap:6px;margin-top:8px;}
.ruleadd input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:8px 10px;border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel-2);color:var(--ui-fg);}
.ruleadd button{font-size:12.5px;padding:8px 12px;cursor:pointer;}
.mylist{list-style:none;margin:8px 0 0;padding:0;}
.mylist li{display:flex;gap:6px;font-size:12px;color:var(--ui-fg-strong);padding:4px 0;border-bottom:1px solid var(--ui-border-low);}
.mylist .x{margin-left:auto;border:0;background:none;color:var(--ui-fg-dim);cursor:pointer;font-size:14px;}
.infobox{margin-top:9px;background:var(--ui-panel-2);border:1px solid var(--ui-border);padding:11px 13px;}
.infobox .ir{display:flex;gap:8px;font-size:11.5px;line-height:1.7;padding:3px 0;}
.infobox .ik{flex:none;width:52px;font-weight:800;color:var(--ui-accent);}
.infobox .iv{color:var(--ui-fg-lower);}

.metarow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

.layprev .r{display:flex;gap:6px;flex:1;}
.layprev .wb{background:var(--ui-border);border-radius:3px;}

.laycap{font-size:11px;color:var(--ui-fg-dim);margin-top:6px;line-height:1.6;}
.laycap b{color:var(--ui-fg-strong);}
.hint{margin-top:6px;line-height:1.6;}

.gobtn{width:100%;cursor:pointer;margin-top:4px;}
.gobtn:hover{filter:brightness(1.15);}

.stage{display:flex;flex-direction:column;gap:16px;min-width:0;}
.card{background:var(--ui-panel);border:1px solid var(--ui-border);padding:18px;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;}

.frame{width:100%;height:min(78vh,900px);border:1px solid var(--ui-border);background:#fff;}
.dev{display:flex;gap:6px;margin-bottom:10px;}
.dev button{border:1px solid var(--ui-border);background:var(--ui-panel-2);color:var(--ui-fg-lower);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;}

.out{position:relative;background:#0d1117;color:#c9d1d9;padding:15px;font-family:"Roboto Mono",monospace;font-size:11.5px;line-height:1.65;max-height:520px;overflow:auto;white-space:pre;}
.out .cp{position:absolute;top:10px;right:10px;background:#238636;color:#fff;border:0;border-radius:7px;font-size:12px;font-weight:700;padding:7px 13px;cursor:pointer;}
.secpick{max-height:230px;overflow:auto;border:1px solid var(--ui-border);border-radius:10px;padding:8px 10px;background:var(--ui-panel-2);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ui-fg-strong);color:var(--ui-canvas);

.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .tundo{pointer-events:auto;margin-left:12px;background:var(--ui-canvas);color:var(--ui-fg-strong);
  border:0;border-radius:999px;font-size:12px;font-weight:700;padding:4px 11px;cursor:pointer;}
</style>

<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1500);};
// 손으로 맞춰 둔 구성을 말없이 덮으면 안 된다. 무엇이 바뀌었는지 적고
// 되돌릴 단추를 같이 띄운다. 읽고 누를 틈이 있어야 하므로 더 오래 둔다.
function toastUndo(m,fn){
  const t=$('#toast');
  t.textContent=m;
  const b=document.createElement('button');
  b.type='button'; b.className='tundo'; b.textContent='되돌리기';
  b.onclick=function(){ t.classList.remove('on'); clearTimeout(t._t); fn(); };
  t.appendChild(b);
  t.classList.add('on'); clearTimeout(t._t);
  t._t=setTimeout(function(){t.classList.remove('on');},6000);
}
function copyText(t){
  // 표준 방법이 막히면 숨긴 칸을 거쳐 복사한다
  return new Promise(function(done,fail){
    try{
      if(navigator.clipboard && window.isSecureContext!==false){
        navigator.clipboard.writeText(t).then(function(){done(1);},function(){ legacy(); });
        return;
      }
    }catch(e){}
    legacy();
    function legacy(){
      try{
        var ta=document.createElement('textarea');
        ta.value=t; ta.setAttribute('readonly','');
        ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
        var okd=document.execCommand('copy');
        ta.remove();
        okd?done(1):fail(0);
      }catch(e){ fail(0); }
    }
  });
}
const copy=(t,m)=>copyText(t).then(()=>toast(m||'복사됨'),()=>toast('복사가 막혔습니다. 상자의 글을 직접 선택해 복사하세요'));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===== 디자인 시스템 (모음집과 동일 값) ===== */
const SYS=[
 {id:'toss',n:'Toss (TDS)',p:'#3182F6',pl:'#E8F3FF',pd:'#1B64DA',g:['#F9FAFB','#F2F4F6','#E5E8EB','#8B95A1','#4E5968','#191F28'],f:'"Pretendard","Toss Product Sans",-apple-system,system-ui,sans-serif',r:10,rc:16},
 {id:'aurora',n:'Aurora',p:'#4178FF',pl:'#EEF3FF',pd:'#244BC0',g:['#F9FAFB','#F2F3F5','#E5E7EC','#7C7E86','#43444A','#212124'],f:'"Pretendard",-apple-system,system-ui,sans-serif',r:8,rc:12},
 {id:'graphite',n:'Graphite',p:'#4F46E5',pl:'#EEF0FE',pd:'#3730A3',g:['#F8FAFC','#F1F5F9','#E2E8F0','#64748B','#334155','#0F172A'],f:'"Pretendard",-apple-system,system-ui,sans-serif',r:6,rc:10},

/* ===== 붙여넣은 자료 읽기 =====
   자료에 없는 값은 지어내지 않는다. 빈칸으로 두고 무엇을 넣을 자리인지 적는다. */
function parseMat(raw){
  const t=(raw||'').replace(/\r/g,'');
  const lines=t.split('\n').map(x=>x.replace(/^[\s·\-*•]+/,'').trim()).filter(Boolean);
  const pairs=[], list=[];
  lines.forEach(function(l){
    const kv=l.match(/^([^:：]{1,16})[:：]\s*(.+)$/);
    if(kv) pairs.push([kv[1].trim(), kv[2].trim()]); else list.push(l);
  });
  const find=function(re){ const p=pairs.find(function(x){return re.test(x[0]);}); return p?p[1]:''; };
  const splitList=function(v){ return (v||'').split(/[,·\/]/).map(function(x){return x.trim();}).filter(Boolean); };
  const m={pairs:pairs, list:list, find:find};
  m.price=(t.match(/([\d,]{3,})\s*원/)||[])[1]||'';
  m.volume=(t.match(/(\d+\s?(?:ml|mL|g|kg|L|정|포|매))/)||[])[1]||'';
  m.ingredients=splitList(find(/성분/));
  m.target=find(/타깃|대상|타겟/);
  m.stats=pairs.filter(function(p){
    if(/가격|용량|성분|타깃|대상|타겟|이름|제품명/.test(p[0])) return false;
    return /\d/.test(p[1]) && p[1].length<=24;
  }).map(function(p){ return [p[1], p[0]]; });
  m.menu=list.filter(function(l){ return /\d[\d,]*\s*원/.test(l); });
  return m;
}

function secBoxes(){ return Array.prototype.slice.call($('#secPick').querySelectorAll('input[data-k]')); }
function exState(){
  return {n:$('#bName').value, t:$('#bTag').value, m:$('#bMat').value,
          page:$('#selPage').value, lay:$('#selLayout').value,
          picked:Array.from(picked), touched:layTouched};
}
function exRestore(s){
  $('#bName').value=s.n; $('#bTag').value=s.t; $('#bMat').value=s.m;
  $('#selPage').value=s.page; loadPage(+s.page);
  picked=new Set(s.picked);
  secBoxes().forEach(function(c){ c.checked=picked.has(+c.dataset.k); });
  $('#selLayout').value=s.lay; layTouched=s.touched;
  const n=$('#layFrom'); if(n) n.hidden=true;
  renderLayPrev(); saveBrief(); auto();
}
function applyEx(x){
  $('#bName').value=x.n; $('#bTag').value=x.t; $('#bMat').value=x.m;
  const i=PAGES.findIndex(function(p){return p.id===x.p;});
  if(i<0) return;
  $('#selPage').value=String(i);
  loadPage(i);
  if(x.s && x.s.length){
    picked=new Set();
    secBoxes().forEach(function(c){
      const on=x.s.indexOf(cur.s[+c.dataset.k][0])>=0;
      c.checked=on; if(on) picked.add(+c.dataset.k);
    });
  }
  layTouched=false;          // 예시가 정한 구조에 맞는 배치를 다시 찾게 한다
  matchLay();
  renderLayPrev();
}

function handoff(){
  let q='';
  try{ q=window.dskQuery?window.dskQuery():''; }catch(e){}
  return new URLSearchParams((q||location.search).replace(/^\?/,''));
}
(function(){
  const Q=handoff();
  const sys=Q.get('sys');
  if(sys){
    const i=SYS.findIndex(function(x){return x.id===sys;});
    if(i>=0) $('#selSys').value=String(i);
  }
  // 두 화면의 목록이 달라서 이름으로 맞춘다. 없으면 기본값을 그대로 둔다.
  const pg=Q.get('page');
  if(pg){
    const i=PAGES.findIndex(function(x){return x.n===pg;});
    if(i>=0) $('#selPage').value=String(i);
  }
  const lay=Q.get('layout'), layname=Q.get('layname');
  if(lay && $('#selLayout').querySelector('[value="'+lay+'"]')){
    $('#selLayout').value=lay;
  }
  // 두 화면의 배치가 1:1 이다. 그래도 어긋나면 고른 것이 사라진 채이므로 적는다.
  const note=$('#layFrom');
  if(note && layname){
    const here=$('#selLayout').selectedOptions[0];
    note.textContent = (here && here.textContent===layname)
      ? '모음집에서 정한 배치입니다.'
      : '모음집에서 정한 ' + layname + ' 을(를) 여기서 찾지 못했습니다. '
        + (here?here.textContent:'') + ' 로 열었습니다.';
    note.hidden=false;
  }
})();

function loadPage(i){
  cur=PAGES[i]; picked=new Set(cur.s.map((_,k)=>k));
  const pi=PAGEINFO[cur.id]||{};
  const nImg=cur.s.filter(function(x){return imgSpec(x[0]);}).length;
  $('#pageInfo').innerHTML='<div style="font-size:14px;color:var(--ui-fg-strong);margin-bottom:5px">'+cur.n+'</div>'
    + infoRows([['흐름',pi.flow],['핵심',pi.key],['대상',pi.who],['참고',cur.refs]])
    + '<div class="metarow"><span>섹션 '+cur.s.length+'개</span><span>이미지 '+nImg+'곳</span>'
    + (pi.len?'<span>'+pi.len+'</span>':'')+'</div>';
  $('#secPick').innerHTML=cur.s.map((x,k)=>
    '<label class="chk"><input type="checkbox" data-k="'+k+'" checked> '+(k+1)+'. '+x[0]+'</label>').join('');
}

let layTouched=false;
function matchLay(){
  if(layTouched) return;            // 직접 고른 뒤에는 되돌리지 않는다
  const p=PAGES[+$('#selPage').value]; if(!p) return;
  const want=PAGELAY[p.id]; if(!want || $('#selLayout').value===want) return;
  $('#selLayout').value=want;
  const n=$('#layFrom');
  if(n){ n.textContent=p.n+' 에 맞춰 '+$('#selLayout').selectedOptions[0].textContent
         +' 로 맞췄습니다. 바꾸셔도 됩니다.'; n.hidden=false; }
}
$('#selPage').onchange=e=>{loadPage(+e.target.value);matchLay();auto();};
$('#secPick').onchange=e=>{const b=e.target;if(!b.dataset.k)return;
  const k=+b.dataset.k; b.checked?picked.add(k):picked.delete(k);};

  $('#myList').innerHTML=a.map((r,i)=>'<li><span>· '+esc(r)+'</span><button class="x" data-i="'+i+'">×</button></li>').join('');

  if($('#rA11y').checked) L.push('- 접근성: focus-visible 2px 링, 본문 대비 4.5:1, 아이콘 버튼 aria-label, prefers-reduced-motion 대응');
  if($('#rBan').checked) L.push('- 금지: 보라/바이올렛 강조색, border-left 굵은 인용카드, 보라에서 핑크로 가는 그라디언트, 이모지 남발, 토큰 외 임의 색');

/* 셸. wrap 이 본문을 받아 페이지 전체 틀을 두른다. */
const SHNAV=['소개','기능','가격','문의'];
function shA(t,h){ return '<a href="'+(h||'#')+'">'+esc(t)+'</a>'; }
function shHead(o){
  return '  <header class="sh-head"><div class="sh-in"><a class="sh-brand" href="#top">'+esc(o.brand)+'</a>'
    +'<nav class="sh-topnav">'+SHNAV.map(function(x){return shA(x);}).join('')+'</nav>'
    +'<a class="btn sm" href="#s1">'+esc(o.cta)+'</a></div></header>';
}
function shFoot(o){
  return '  <footer class="sh-foot"><div class="sh-in"><span>© '+esc(o.brand)+'</span>'
    +'<nav>'+['이용약관','개인정보처리방침','문의'].map(function(x){return shA(x);}).join('')+'</nav></div></footer>';
}
function shMenu(o){
  return '<div class="sh-brand">'+esc(o.brand)+'</div><nav class="sh-menu">'
    + o.secs.map(function(x,i){return shA(x.t,'#s'+(i+1));}).join('') + '</nav>';
}
function shMain(m){ return '\n  <main class="sh-main" id="top">'+m+'\n  </main>\n'; }

"reel":{n:"Reel (가로 스크롤 줄)",d:"한 줄에 담고 옆으로 밀어 본다. 오른쪽이 잘려 보여야 더 있다는 신호가 된다. 넷플릭스식 캐러셀. Every Layout 의 원시 배치.",w:"<div class=\"wb\" style=\"height:8px;width:36%\"></div><div style=\"display:flex;gap:5px;height:44px;overflow:hidden\"><div class=\"wa\" style=\"width:30%;flex:none\"></div><div class=\"wb\" style=\"width:30%;flex:none\"></div><div class=\"wb\" style=\"width:30%;flex:none\"></div><div class=\"wb\" style=\"width:30%;flex:none\"></div></div><div class=\"wb\" style=\"height:8px;width:36%\"></div><div style=\"display:flex;gap:5px;height:44px;overflow:hidden\"><div class=\"wb\" style=\"width:30%;flex:none\"></div><div class=\"wa\" style=\"width:30%;flex:none\"></div><div class=\"wb\" style=\"width:30%;flex:none\"></div><div class=\"wb\" style=\"width:30%;flex:none\"></div></div>",shell:"plain",flow:"reel"},
"imposter":{n:"Imposter (겹쳐 띄우기)",d:"바탕 위에 하나를 덮어 띄운다. 모달, 말풍선, 알림. 바탕을 가리는 정도로 급한 정도를 나타낸다. Every Layout 의 원시 배치.",w:"<div style=\"position:relative;flex:1\"><div class=\"wb\" style=\"position:absolute;inset:0\"></div><div class=\"wa\" style=\"position:absolute;left:18%;top:22%;width:64%;height:56%;border-radius:6px\"></div></div>",shell:"plain",flow:"imposter"},
"frame":{n:"Frame (비율 고정 틀)",d:"안에 무엇이 들어오든 16:9 같은 비율을 지킨다. 영상, 썸네일, 지도. 목록이 들쭉날쭉해지지 않는다. Every Layout 의 원시 배치.",w:"<div class=\"wa\" style=\"height:52px\"></div><div class=\"wb\" style=\"height:8px;width:70%\"></div><div class=\"wb\" style=\"height:8px;width:50%\"></div><div style=\"display:flex;gap:5px;flex:1\"><div class=\"wb\" style=\"flex:1\"></div><div class=\"wb\" style=\"flex:1\"></div></div>",shell:"plain",flow:"frame"},
"supportpane":{n:"Supporting Pane (본문 + 보조 패널)",d:"넓은 본문 옆에 좁은 패널을 붙여 보조 정보를 띄운다. 좁은 화면에서는 패널이 아래로 내려간다. 머티리얼 3 의 표준 배치.",w:"<div class=\"wb\" style=\"height:10px\"></div><div style=\"display:flex;gap:5px;flex:1\"><div class=\"wa\" style=\"flex:2\"></div><div style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><div class=\"wb\" style=\"flex:1\"></div><div class=\"wb\" style=\"flex:1\"></div></div></div>",shell:"stickyAside",flow:"alt"},

"search":{n:"Search Results (검색 결과 · 필터 + 목록)",d:"위에 검색칸, 왼쪽에 좁히는 조건, 오른쪽에 결과를 둔다. 조건을 바꾸면 결과만 다시 그린다. 쇼핑, 채용, 문서 검색.",w:"<div class=\"wa\" style=\"height:12px;border-radius:999px\"></div><div style=\"display:flex;gap:5px;flex:1\"><div style=\"width:26%;display:flex;flex-direction:column;gap:4px\"><div class=\"wb\" style=\"height:8px\"></div><div class=\"wb\" style=\"height:8px\"></div><div class=\"wb\" style=\"height:8px\"></div></div><div style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><div class=\"wb\" style=\"height:18px\"></div><div class=\"wb\" style=\"height:18px\"></div><div class=\"wb\" style=\"height:18px\"></div></div></div>",shell:"filter",flow:"feed"},
"megamenu":{n:"Mega Menu (대형 메뉴 펼침)",d:"메뉴 하나를 누르면 넓은 판이 내려와 하위 항목을 묶어 보여 준다. 품목이 많은 쇼핑몰과 기업 사이트.",w:"<div style=\"display:flex;gap:6px;height:10px\"><div class=\"wb\" style=\"width:18%\"></div><div class=\"wa\" style=\"width:14%\"></div><div class=\"wb\" style=\"width:14%\"></div></div><div class=\"wb\" style=\"height:1px\"></div><div style=\"display:flex;gap:5px;height:48px\"><div style=\"flex:1;display:flex;flex-direction:column;gap:3px\"><div class=\"wa\" style=\"height:7px;width:60%\"></div><div class=\"wb\" style=\"height:6px\"></div><div class=\"wb\" style=\"height:6px\"></div></div><div style=\"flex:1;display:flex;flex-direction:column;gap:3px\"><div class=\"wa\" style=\"height:7px;width:60%\"></div><div class=\"wb\" style=\"height:6px\"></div><div class=\"wb\" style=\"height:6px\"></div></div><div style=\"flex:1;display:flex;flex-direction:column;gap:3px\"><div class=\"wa\" style=\"height:7px;width:60%\"></div><div class=\"wb\" style=\"height:6px\"></div></div></div><div class=\"wb\" style=\"flex:1\"></div>",shell:"mega",flow:"stack"},
"menu2":{n:"Menu 2단 (클래식 다이닝 메뉴판)",d:"가운데 세로선 기준 좌우 2단. 왼쪽 전채·메인, 오른쪽 사이드·음료. 종이 메뉴판의 기본형.",w:"<div class=\"wa\" style=\"height:14px;width:52%;margin:0 auto\"></div><div style=\"display:flex;gap:12px;flex:1;position:relative\"><div style=\"flex:1;display:flex;flex-direction:column;gap:6px\"><div class=\"wa\" style=\"height:8px;width:46%\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wa\" style=\"height:8px;width:40%;margin-top:5px\"></div><div class=\"wb\" style=\"height:7px\"></div></div><div style=\"width:1px;background:var(--ui-border)\"></div><div style=\"flex:1;display:flex;flex-direction:column;gap:6px\"><div class=\"wa\" style=\"height:8px;width:42%\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wa\" style=\"height:8px;width:36%;margin-top:5px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px\"></div></div></div>",shell:"plain",flow:"menu2"},
"menudots":{n:"Menu 점선 리더 (가격 우측 정렬형)",d:"메뉴명 ---- 가격 형태로 점선이 이어짐. 항목이 많고 사진이 없는 메뉴판에 적합.",w:"<div class=\"wa\" style=\"height:11px;width:40%\"></div>`+[1,2,3,4,5].map(function(){return '<div style=\"display:flex;align-items:center;gap:6px;height:10px\"><div class=\"wb\" style=\"width:34%;height:7px\"></div><div style=\"flex:1;border-bottom:1px dotted var(--ui-border)\"></div><div class=\"wa\" style=\"width:13%;height:7px\"></div></div>';}).join('')+`<div class=\"wa\" style=\"height:9px;width:32%;margin-top:4px\"></div><div style=\"display:flex;align-items:center;gap:6px;height:10px\"><div class=\"wb\" style=\"width:30%;height:7px\"></div><div style=\"flex:1;border-bottom:1px dotted var(--ui-border)\"></div><div class=\"wa\" style=\"width:13%;height:7px\"></div></div>",shell:"plain",flow:"dots"},
"menuphoto":{n:"Menu 사진 그리드 (카페·배달 메뉴)",d:"사진+이름+가격 카드를 격자로. 실물 확인이 중요한 카페·디저트·배달앱 메뉴.",w:"<div style=\"display:flex;gap:4px;height:10px\"><div class=\"wa\" style=\"flex:1\"></div><div class=\"wb\" style=\"flex:1\"></div><div class=\"wb\" style=\"flex:1\"></div></div><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1\">`+[1,2,3,4,5,6].map(function(i){return '<div style=\"display:flex;flex-direction:column;gap:3px\"><div class=\"'+(i===1?'wa':'wb')+'\" style=\"flex:1\"></div><div class=\"wb\" style=\"height:5px;width:80%\"></div><div class=\"wa\" style=\"height:5px;width:44%\"></div></div>';}).join('')+`</div>",shell:"plain",flow:"photogrid"},
"menugolden":{n:"Menu 시그니처 강조 (골든 트라이앵글)",d:"가장 팔고 싶은 메뉴를 우상단·중앙에 박스로 크게. 나머지는 리스트로 받쳐줌.",w:"<div style=\"display:flex;gap:6px;flex:1\"><div style=\"flex:1;display:flex;flex-direction:column;gap:5px\"><div class=\"wb\" style=\"height:7px;width:60%\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px;width:80%\"></div><div class=\"wb\" style=\"height:7px\"></div></div><div style=\"width:40%;display:flex;flex-direction:column;gap:5px\"><div class=\"wa\" style=\"flex:1;border-radius:6px\"></div><div class=\"wb\" style=\"height:7px\"></div><div class=\"wb\" style=\"height:7px;width:70%\"></div></div></div>",shell:"plain",flow:"golden"}
};
function infoRows(rows){
  return rows.filter(function(r){return r[1];}).map(function(r){
    return '<div class="ir"><span class="ik">'+r[0]+'</span><span class="iv">'+r[1]+'</span></div>';
  }).join('');
}
function layDef(){
  const v=$('#selLayout').value;
  return LAYMETA[v] || LAYMETA[Object.keys(LAYMETA)[0]];
}
function renderLayPrev(){
  const d=layDef(), fl=FLOW[d.flow]||FLOW.stack, sh=SHELL[d.shell]||SHELL.plain;
  $('#layPrev').innerHTML=d.w||'';
  $('#layInfo').innerHTML='<div style="font-size:14px;color:var(--ui-fg-strong);margin-bottom:5px">'+esc(d.n)+'</div>'
    +'<div style="font-size:11.5px;color:var(--ui-fg-lower);line-height:1.7;margin-bottom:6px">'+esc(d.d)+'</div>'
    +infoRows([['페이지 틀',esc(sh.n)+' · '+esc(sh.c)],['섹션 배치',esc(fl.n)+' · '+esc(fl.c)]])
    +'<div class="metarow"><span>셸 '+esc(d.shell)+'</span><span>흐름 '+esc(d.flow)+'</span></div>';
}
/* 두 색의 대비비. 새 색을 만들지 않고 램프 안에서 고르는 데만 쓴다. */
function lum(hex){
  const n=[1,3,5].map(function(i){
    let v=parseInt(hex.slice(i,i+2),16)/255;
    return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4);
  });
  return .2126*n[0]+.7152*n[1]+.0722*n[2];
}
function ratio(a,b){
  const x=lum(a), y=lum(b);
  return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);
}
/* 후보를 앞에서부터 보며 4.5 에 닿는 첫 값을 쓴다. 없으면 가장 센 값을 쓴다. */
function pick(cands,bg){
  let best=cands[0];
  for(let i=0;i<cands.length;i++){
    if(ratio(cands[i],bg)>=4.5) return cands[i];
    if(ratio(cands[i],bg)>ratio(best,bg)) best=cands[i];
  }
  return best;
}
function build(silent){
  const s=SYS[+$('#selSys').value], lay=$('#selLayout').value, dark=$('#darkMode').checked;
  const LD=layDef(), fl=FLOW[LD.flow]||FLOW.stack, sh=SHELL[LD.shell]||SHELL.plain;
  const secs=cur.s.map((x,k)=>({t:x[0],d:x[1],kind:x[2]||'block',k})).filter(x=>picked.has(x.k));
  const showSpec=$('#rImg').checked, motion=$('#rMotion').checked, a11y=$('#rA11y').checked;
  const bg = dark? s.g[5] : '#FFFFFF', canvas = dark? '#0E0E11' : s.g[0];
  const fg = dark? '#FFFFFF' : s.g[5], border = dark? s.g[4] : s.g[2];
  const prim = s.p, primLow = dark? s.g[4] : s.pl;
  // 보조 글자는 섹션이 번갈아 깔리므로 둘 중 밝은 바탕에 맞춘다
  const fgLow = dark? pick([s.g[2],s.g[1],s.g[0],'#FFFFFF'], s.g[5])
                    : pick([s.g[3],s.g[4],s.g[5]], s.g[0]);
  // 연한 강조 바탕 위에 올릴 글자색
  const primInk = dark? pick([s.pl,s.g[0],'#FFFFFF'], primLow)
                      : pick([s.pd,s.g[5]], primLow);
  // 흰 글자가 읽히는 농도의 버튼 바탕
  const btnBg = pick([s.p, s.pd, s.g[5]], '#FFFFFF');

  const bN=$('#bName').value.trim(), bT=$('#bTag').value.trim();
  const mat=parseMat($('#bMat').value);
  let body='';
  secs.forEach((sec,i)=>{
    const ctx={sec:sec, i:i, brand:bN, tag:bT, m:mat, lay:lay, showSpec:showSpec, page:cur.id};
    const comp=COMP[sec.kind]||COMP.block;
    const cls='sec f-'+LD.flow+(fl.rev&&(i%2)?' rev':'');
    body += '\n      <!-- '+(i+1)+'. '+sec.t+' -->\n      <section class="'+cls+'" id="s'+(i+1)+'"'+(motion?' data-rv':'')
         + '>\n        <div class="inner" data-t="'+esc(sec.t)+'">'+comp(ctx)+'</div>\n      </section>';
  });
  // 흐름에 상자가 필요하면 섹션 전체를 한 번 감싼다
  if(fl.w) body='\n    <div class="flow '+fl.w+(fl.narrow?' narrow':'')+'">'+body+'\n    </div>';
  const shOpt={brand:bN||cur.n, title:cur.n, cta:noun({page:cur.id},'cta'), secs:secs};
  const page=sh.wrap(body, shOpt);

  const css = [
'    :root{',
'      --primary: '+prim+';  --primary-low: '+primLow+';  --primary-dark: '+s.pd+';',
'      --primary-ink: '+primInk+';  --btn-bg: '+btnBg+';',
'      --bg: '+bg+';  --canvas: '+canvas+';  --fg: '+fg+';  --fg-low: '+fgLow+';  --border: '+border+';',
'      --r-btn: '+(s.r===999?'999px':s.r+'px')+';  --r-card: '+s.rc+'px;',
'      --font: '+s.f+';',
'      --pad: clamp(24px, 5vw, 80px);',
'      --w: min(1200px, 92vw);',
'    }',
'    *{box-sizing:border-box;}',
'    body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--font);line-height:1.65;',
'      -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;line-break:strict;}',
'    h1,h2,h3{text-wrap:balance;} p,.lead,.cd{text-wrap:pretty;}',
'    .sec{padding:var(--pad) 0;}',
'    .sh-main>.sec:nth-child(even){background:var(--bg);}',
'    .inner{width:var(--w);margin:0 auto;}',
'    .ph{width:100%;background:var(--primary-low);border:1px dashed var(--border);border-radius:var(--r-card);',

function prompt(s,lay,secs,css){
  const M=LAYMETA[lay]||layDef(), MF=FLOW[M.flow]||FLOW.stack, MS=SHELL[M.shell]||SHELL.plain;
  const L=[];
  const b=brief();
  L.push('# '+((b.n&&b.n.trim())||cur.n)+' 제작 요청');
  L.push('');
  L.push('아래 스펙 그대로 **단일 HTML 파일**을 만들어줘. 값은 임의로 바꾸지 말고 그대로 쓸 것.');
  L.push('');
  if((b.n&&b.n.trim())||(b.t&&b.t.trim())||(b.m&&b.m.trim())){
    L.push('## 0) 실제 프로젝트 정보 (이 내용으로 카피를 써 줘)');
    if(b.n&&b.n.trim()) L.push('- 이름: '+b.n.trim());
    if(b.t&&b.t.trim()) L.push('- 한 줄 소개: '+b.t.trim());
    if(b.m&&b.m.trim()){
      L.push('- 참고 자료:');
      L.push('```');
      L.push(b.m.trim());
      L.push('```');
    }
    L.push('');
    L.push('**중요**: 아래 섹션 설명은 "무엇을 넣을지"에 대한 안내다. 실제 문구는 위 자료를 근거로 쓰고,');
    L.push('자료에 없는 수치·효능·인증은 지어내지 말 것. 부족하면 자리표시자로 남기고 무엇이 필요한지 표시할 것.');
    L.push('');
  }
  L.push('## 1) 배치 '+M.n);
  L.push('- '+M.d);
  L.push('- 페이지 틀: '+MS.n+'. '+MS.c);
  L.push('- 섹션 배치: '+MF.n+'. '+MF.c);
  L.push('- 참고 사이트: '+cur.refs);
  L.push('');
  L.push('## 2) 섹션 (이 순서 그대로, 각 섹션 앞에 주석)');
  secs.forEach(function(x,i){
    const sp=imgSpec(x.t);
    L.push('');
    L.push((i+1)+'. **'+x.t+'**');
    L.push('   - 내용: '+x.d);
    L.push('   - 마크업: <section class="sec f-'+M.flow+(MF.rev&&(i%2)?' rev':'')+'"> > .inner');
    if(sp){
      L.push('   - 이미지 슬롯: '+sp.label+' · 권장 '+sp.size+' · aspect-ratio: '+sp.ar);
      L.push(', <div class="ph" style="aspect-ratio:'+sp.ar+'"> 안에 라벨과 규격 텍스트를 표시 (실제 이미지 없이 플레이스홀더)');
    } else {
      L.push('   - 이미지 없음 (텍스트 블록만)');
    }
    if(i===0) L.push('   - 이 섹션에만 CTA 버튼 2개 (.btn 기본 / .btn2 보조)');
  });
  L.push('');
  L.push('## 3) 디자인 토큰 '+s.n+' (아래 CSS를 그대로 사용)');
  L.push('```css');
  L.push(css);
  L.push('```');
  L.push('');
  L.push('## 4) 규칙');
  rulesText().forEach(function(r){L.push(r);});
  L.push('');
  L.push('## 5) 출력 형식');
  L.push('- 의존성 없는 단일 HTML 파일 (Pretendard CDN 링크만 허용)');
  L.push('- 위 CSS를 <style>에 그대로 넣고, 섹션 마크업만 추가');
  L.push('- 클래스명: .sec.f-'+M.flow+(MF.w?' / .flow.'+MF.w:'')+' / .inner / .ph / .phl / .phs / .tx / .num / .cta / .btn / .btn2');
  L.push('- 위 CSS 에 들어 있는 셸(.sh-*) 마크업을 그대로 두르고 본문만 섹션으로 채울 것');
  L.push('- 이미지는 전부 플레이스홀더(.ph)로, 실제 파일 참조 금지');
  return L.join('\n');
}

$('#btnOpen').onclick=()=>{
  if(!html){toast('먼저 생성하세요');return;}
  // 팝업이 막히면 window.open 은 null 을 돌려준다.
  // 그대로 쓰면 오류로 멈추므로 대신 파일로 내려준다.
  let w=null;
  try{ w=window.open('','_blank'); }catch(e){}
  if(w && w.document){ w.document.write(html); w.document.close(); return; }
  const b=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=(brief().n||'page')+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('새 탭이 막혔습니다. 파일로 내려받았습니다');
};
$('#btnUi').onclick=()=>{const r=document.documentElement;r.setAttribute('data-ui',r.getAttribute('data-ui')==='dark'?'light':'dark');};

(function(){ const b=brief();

loadPage(0); renderMy(); renderLayPrev(); build();
